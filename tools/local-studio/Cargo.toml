# Galion Voice — Perpetual Open MIT License. (c) 2026 Galion Labs.
[package]
name = "galion-local-studio"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
publish = false
description = "Local studio render: owner reference, N takes, WER, ECAPA, emotion, 432 Hz bed, loudness master."

[[bin]]
name = "galion-local-studio"
path = "src/main.rs"

[dependencies]
hound = "3.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.8"

# Own workspace, same pattern as tools/symphony/voice-v2.
# The locked voice runtime does not build this tool, and this manifest
# does not link an inference runtime.
[workspace]

[profile.release]
opt-level = 3
