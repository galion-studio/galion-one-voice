[package]
name = "galion-lungs"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "Symphony lungs layer: plan inhalations from the phrase, track relative lung volume and subglottal pressure, and render audible breaths. Physiology, not an emotion."

[[bin]]
name = "galion-lungs"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Own workspace, same pattern as tools/symphony/articulation.
# The locked voice runtime does not build this tool.
[workspace]
