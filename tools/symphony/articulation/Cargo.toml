# Galion Voice — Perpetual Open MIT License. (c) 2026 Galion Labs.
[package]
name = "galion-articulation"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "Symphony articulation layer: throat / mouth / nose features per 80 ms tick for any voice, plus a reference-vs-clone articulation score (TractPrint). Glue around praatfan_rust (MIT) in process, and SPARC, DisVoice, Phonet and Rhubarb (all MIT) out of process."

[[bin]]
name = "galion-articulation"
path = "src/main.rs"

[dependencies]
# Reused brick: clean-room Praat analysis in pure Rust (MIT), pinned to the v0.1.16 tag.
praatfan_rust = { git = "https://github.com/ucpresearch/praatfan-core-clean", tag = "v0.1.16" }
hound = "3.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Own workspace: the locked voice runtime does not build this tool
# (same pattern as tools/emotion-v2/refcheck and runtimes/galion-piper-rt).
[workspace]

[profile.release]
opt-level = 3
