[package]
name = "galion-voice-v2"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "Voice V2 glue: decode a reference, render a target feeling, read the audio back, correct once. Reuses galion-articulation and the existing cbx Chatterbox CLI."

[[bin]]
name = "galion-voice-v2"
path = "src/main.rs"

[dependencies]
galion-articulation = { path = "../articulation" }
hound = "3.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Own workspace, same pattern as tools/symphony/articulation.
# The locked voice runtime does not build this tool.
[workspace]

[profile.release]
opt-level = 3
