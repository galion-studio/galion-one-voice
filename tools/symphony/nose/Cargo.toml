[package]
name = "galion-nose"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "Symphony nose layer: velum and nasal murmur per 80 ms tick, and wordless vocal bursts on their own track."

[[bin]]
name = "galion-nose"
path = "src/main.rs"

[dependencies]
galion-mne-contract = { path = "../mne-contract" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Own workspace, same pattern as tools/symphony/articulation and tools/symphony/lungs.
# The locked voice runtime does not build this tool.
[workspace]
