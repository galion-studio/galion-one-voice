[package]
name = "simsel"
version = "0.1.0"
edition = "2021"
description = "Lightning-fast Rust reference prep, multi-clip pack builder, and best-of-N selection for cloning-v2 similarity"
license = "MIT"

[[bin]]
name = "simsel"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
hound = "3.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
