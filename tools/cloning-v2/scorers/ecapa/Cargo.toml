[package]
name = "galion-ecapa"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "galion-ecapa"
path = "src/main.rs"

[dependencies]
anyhow = "1"
hound = "3.5.1"
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["std"] }
realfft = "3.5.1"
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
