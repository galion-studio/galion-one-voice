[package]
name = "galion-fidelity"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "Cloning V2 reference fidelity: best-segment conditioning, embedding averages, opt-in spectral envelope, offline eval"

[workspace]

[dependencies]
hound = "=3.5.1"
rustfft = "=6.2.0"
serde = { version = "=1.0.217", features = ["derive"] }
serde_json = "=1.0.138"

[[bin]]
name = "galion-fidelity"
path = "src/bin/galion-fidelity.rs"
