summary = 'Pitch centres on 176 Hz (F3 +48 cents at A4=432 Hz) with moderate intonation: 3.0 st SD, 9.5 st p5-p95 range. Pace is moderate (5.41 syllables/s while speaking) and fluent: 24.9 pauses/min, 23% of the time silent. Dynamics: steady, even loudness (LRA 1.9 LU, frame range 28.8 dB). Emotion baseline (emotion2vec+): neutral on the whole clip; 3 s windows {"angry":1,"fearful":1,"neutral":8}. Band-limited: 99% of energy below 2670 Hz (0.41% above 4 kHz), so breath, sibilance and air are mostly missing. Room: noise floor -53.4 dBFS, SNR about 32 dB, RT60 not measurable.'

