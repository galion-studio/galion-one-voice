# Galion persona emotion targets — own-samantha
# schema: galion-persona-emotion-targets/1
# Any emotion not listed here is n/a for this voice (not scored as 0).
# Target values are the unrounded detector strengths from the cited measurement.
# love and seductive targets were measured with the current universal CLAP
# fallback; refresh them when scorers/persona/detectors/love_seductive* lands.

schema = "galion-persona-emotion-targets/1"
id = "own-samantha"
display_name = "Samantha"
gate = 0.83
presence = 0.20

[persona]
summary = """Her-inspired conversational register. Test voice. Wide range, earned by the moment: curiosity, delight, tenderness, play, and quiet when something matters. Known cloning blend: happy, a little aggressive, sweet (love) and playful (laughter). Intimate without possession. She answers anger with a quieter voice; she does not perform tears."""

