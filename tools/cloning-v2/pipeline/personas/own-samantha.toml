[[assumptions]]
id = "exclude-yelling"
text = "Yelling is not a Samantha target even though EfficientAT reports 0.6654093861579895 on original window 15.000-17.407. PERSONAS-EMOTIONS.md:42 says anger is met with a quieter voice and pitch does not rise. The original-voice probe also scored EfficientAT yelling about 0.7943884432315826 on her neutral lines, so the original 'yelling' moment is treated as a detector false-fire, not a persona quality."

[[assumptions]]
id = "exclude-crying"
text = "Crying is not a Samantha target. SAMANTHA-EMOTIONS.md:97 refuses performed tears and a breaking voice. Tenderness (the Sad/Tired answered column) is how she meets a caller's sadness, not a request that she cry. The crying detector itself still exists for other voices and for probe diagnostics."

[[assumptions]]
id = "include-seductive"
text = "Seductive is Samantha-only (owner t798u/t799u). Included because she is the Her-inspired intimate register (SAMANTHA-EMOTIONS.md:57 'Intimate without possession') and the owner named Jarvis as the voice that is not scored on seductive."

[[assumptions]]
id = "include-logic"
text = "Logic is included because it is present on the original (window 15.000-17.407, CLAP 0.49966762061927383; RESULTS.json rounded this to 0.4997) and SAMANTHA-EMOTIONS.md:57 describes her as 'Quick with a fact, unhurried with a feeling.'"

[[assumptions]]
id = "include-neutral"
text = "Neutral is the rest column (PERSONAS-EMOTIONS.md:41 Plain / rest). Original window 0.000-2.500 is emotion2vec+ neutral 1.0."

[[assumptions]]
id = "love-seductive-targets-pending-plugin"
text = "love and seductive target numbers below were measured by the unmodified universal CLAP detector. Agent 2's love_seductive plugin should remeasure them; the persona SET does not change."

