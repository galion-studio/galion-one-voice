[package]
name = "chatterbox-rs"
version = "0.2.0-timbre"
edition = "2024"
license = "Apache-2.0 OR MIT"
description = "cbx-v2-timbre: shared LTAS tone-colour/depth: sinc resample, true-peak limiter, declick, sampling controls"

[features]
coreml = ["ort/coreml"]
directml = ["ort/directml"]
cuda = ["ort/cuda"]

[[bin]]
name = "cbx"
path = "src/bin/cbx.rs"

[[bin]]
name = "chatterbox-onnx"
path = "src/bin/chatterbox_onnx.rs"

[dependencies]
anyhow = "1.0.95"
clap = { version = "4.5.27", features = ["derive"] }
bincode = "1.3.3"
fastrand = "2.3.0"
half = "2.7.1"
hf-hub = "0.4.3"
hound = "3.5.1"
ndarray = "0.16.1"
ort = { version = "2.0.0-rc.10", features = ["half"] }
rubato = "=0.16.2"
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.145"
tokenizers = { version = "0.22.2", default-features = false, features = ["onig"] }
ureq = "2.12.1"
urlencoding = "2.1.3"

[dev-dependencies]
tempfile = "3.14.0"

[[bin]]
name = "cbx-blend"
path = "src/bin/cbx_blend.rs"

[workspace]
