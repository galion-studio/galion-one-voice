[package]
name = "galion-expression"
version = "0.1.0"
edition = "2021"
publish = false
description = "Opt-in expression profile, conditioning plan, and Samantha love/warmth diagnostic"

[[bin]]
name = "galion-expression"
path = "src/main.rs"

[lib]
name = "galion_expression"
path = "src/lib.rs"

[dependencies]
anyhow = "=1.0.95"
clap = { version = "=4.5.23", features = ["derive"] }
galion-persona = { path = "../../scorers/persona/galion-persona" }
hound = "=3.5.1"
serde = { version = "1.0.220", features = ["derive"] }
serde_json = "=1.0.145"

[workspace]
