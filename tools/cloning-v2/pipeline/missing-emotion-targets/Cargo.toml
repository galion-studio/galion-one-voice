[package]
name = "galion-emotion-targets"
version = "0.1.0"
edition = "2021"
publish = false
description = "Opt-in pipeline stage: synthesize missing emotions, score them, write per-emotion reference targets"

[[bin]]
name = "galion-emotion-targets"
path = "src/main.rs"

[lib]
name = "galion_emotion_targets"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
hound = "3.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[workspace]
