[package]
name = "galion-emotion12"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Glue: emotion2vec+ ONNX (via ort) -> per-emotion posterior for the Emotion V2 gate. Emotion list and class mapping come from emotion-v2/emotions.toml."
publish = false

[[bin]]
name = "galion-emotion12"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.95"
hound = "3.5.1"
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["std", "load-dynamic", "cuda"] }
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.145"
toml = "0.8"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4

[workspace]
