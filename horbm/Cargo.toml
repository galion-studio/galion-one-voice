# Workspace for crate `horbm`. Not a member of the repo root workspace.
# The voice-stack bridge depends on `crates/horbm` by path.

[workspace]
resolver = "2"
members = ["crates/horbm"]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT"
publish = false
rust-version = "1.85"
