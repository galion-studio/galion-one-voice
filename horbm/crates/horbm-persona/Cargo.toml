[package]
name = "horbm-persona"
description = "HORBM persona: the character loaded once at boot. Open traits, honesty, boundaries, and a style hook. CPU only."
version = "0.0.1"
edition = "2021"
license = "MIT"
publish = false
rust-version = "1.85"

[dependencies]
galion-emotion-core = { path = "../../../crates/galion-emotion-core" }
serde = { version = "1", features = ["derive"] }
# galion-mne-contract, pulled in through horbm-duplex, pins toml = "=0.8.19".
# One workspace can select only one toml. 0.8.19 is that pin.
toml = "=0.8.19"
