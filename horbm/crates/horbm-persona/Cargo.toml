[package]
name = "horbm-persona"
description = "HORBM persona: the character loaded once at boot. Open traits, honesty, boundaries, and a style hook. CPU only."
version = "0.0.1"
edition = "2021"
license = "MIT"
publish = false
rust-version = "1.85"

[dependencies]
galion-emotion-core = { path = "../../../crates/galion-emotion-core" }
serde = { version = "1", features = ["derive"] }
# 0.8.19 does not compile against serde 1.0.229 (serde_core). 0.8.23 matches the
# serde already in this workspace. The horbm workspace rust-version is 1.85.
toml = "0.8.23"
