[package]
name = "horbm-voice"
description = "HORBM-native voice turn. Energy ear, brain turn, mouth, on the conductor frame clock. The configured persona's moment drives pace, noise, pitch, energy, pause, and breath. Piper and Vosk are optional adapters."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[features]
default = []
# Optional mouth. Not compiled into the core. Does not spawn Piper unless the
# host builds `PiperMouth` around `PiperTts`.
piper = ["dep:galion-tts-piper"]
# Optional ear. Not compiled into the core. `VoskAsr` dlopens libvosk; the
# feature test uses `FakeAsr` and does not load a model.
vosk = ["dep:galion-sam-asr"]
# Compile the hardware probe. The default build is CPU and does not look
# for a device. GPU is selected only when this feature is on and a device
# is present.
gpu = []

[dependencies]
horbm = { path = "../horbm" }
galion-emotion-core = { path = "../../../crates/galion-emotion-core" }
galion-sam-prosody = { path = "../../../voice-stack/emotion-prosody" }
galion-tts-piper = { path = "../../../voice-stack/tts-piper-stream", optional = true }
galion-sam-asr = { path = "../../../voice-stack/asr", optional = true }

[dev-dependencies]
galion-emotion = { path = "../../../galion-emotion" }
horbm-ear = { path = "../../../crates/horbm-ear" }
