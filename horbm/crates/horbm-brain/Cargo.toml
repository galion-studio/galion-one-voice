[package]
name = "horbm-brain"
description = "HORBM phase 4 brain: heuristic pick of one stored clause, the versioned HKB1 file, and the zero-alloc scan of that file plus the person-diary arena."
version = "0.0.1"
edition = "2021"
license = "MIT"
publish = false
rust-version = "1.85"

[features]
default = []
# Swarm 2 (FTS5, crates/horbm-retrieval) had not landed when this crate was
# written. The feature compiles the retrieval plug and does not link a crate.
retrieval = []
# Compiles the key-plug note. The stored file always links the crates below.
keys = []
simd-avx2 = ["galion-tensor/simd-avx2", "horbm-keys/simd-avx2"]
simd-avx512 = ["galion-tensor/simd-avx512", "horbm-keys/simd-avx512"]
simd-neon = ["galion-tensor/simd-neon", "horbm-keys/simd-neon"]

[dependencies]
galion-tensor = { path = "../../../crates/galion-tensor", default-features = false }
horbm-keys = { path = "../../../crates/horbm-keys", default-features = false }
