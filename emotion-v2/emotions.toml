coordinate_basis = "design"
coordinate_note = "Design point: positive, low arousal, above calm. Cowen et al. 2019 summarise Juslin and Laukka 2003 as recognising tenderness in speech prosody, and separately find sympathy in vocal bursts. Tender is not a Cowen and Keltner 2017 dimension name."
