#
# Samantha, Emotion V2. Machine-readable inventory.
# Prose, citations, and the scoring problem: docs/emotion-v2/TAXONOMY.md
#
# Pitch centre is the just unison 1/1 at 432 Hz. Emotional pitch is a
# 5-limit just ratio times that centre. The centre is never moved to 440 Hz.
# A range may contain 440 Hz inside it. That is not a retune.
#
# Valence and arousal are design coordinates on Russell's circumplex axes
# (pleasure positive, arousal positive), each in [-1, 1]. Where coordinate_basis
# is russell-1980-angle, the pair is round(cos θ, 2), round(sin θ, 2) for the
# angle Russell (1980) states in running text. Radius 1 is the perimeter.
# Russell's P is intersubject agreement, not this radius. Other pairs are
# design points and must not be read as his measurements.
#
# Intensity scales prosody from the neutral full target toward this emotion's
# full target. Neutral allows only full, because it is the origin of that scale.

schema = "galion-emotion-v2/1"
persona = "samantha"
status = "design"
pitch_centre_hz = 432
pitch_centre_ratio = "1/1"
pitch_retune_forbidden_hz = [440]

[intensity]
low = 0.35
mid = 0.65
full = 1.0

[superb]
model = "superb/wav2vec2-base-superb-er"
labels = ["neu", "hap", "ang", "sad"]

[emotion2vec_plus]
model = "emotion2vec/emotion2vec_plus_large"
labels = ["angry", "disgusted", "fearful", "happy", "neutral", "other", "sad", "surprised", "unknown"]

# The live scorer's one mixed vector is recorded here so it cannot be mistaken
# for a target. known_context is the rounded brief (it sums to 1.01). The
# in-repo example is a different vector and does sum to 1. Neither is a
# per-emotion reference.
[legacy_scorer]
role = "not-a-target"
emotion_match_cap_known = 0.80
known_context = { neu = 0.35, hap = 0.20, ang = 0.14, sad = 0.32 }
in_repo_profile_example = { neu = 0.350, hap = 0.213, ang = 0.119, sad = 0.318 }

[sources.ekman1992]
citation = "Ekman, P. (1992). An argument for basic emotions. Cognition and Emotion, 6(3-4), 169-200."
doi = "10.1080/02699939208411068"

[sources.ekman1993]
citation = "Ekman, P. (1993). Facial expression and emotion. American Psychologist, 48(4), 384-392."
doi = "10.1037/0003-066X.48.4.384"

[sources.russell1980]
citation = "Russell, J. A. (1980). A circumplex model of affect. Journal of Personality and Social Psychology, 39(6), 1161-1178."

[sources.cowen2017]
citation = "Cowen, A. S., & Keltner, D. (2017). Self-report captures 27 distinct categories of emotion bridged by continuous gradients. Proceedings of the National Academy of Sciences, 114(38), E7900-E7909."
doi = "10.1073/pnas.1702247114"

[sources.cowen2019]
citation = "Cowen, A. S., Elfenbein, H. A., Laukka, P., & Keltner, D. (2019). Mapping 24 emotions conveyed by brief human vocalization. American Psychologist, 74(6), 698-712."
doi = "10.1037/amp0000399"

[sources.posner2005]
citation = "Posner, J., Russell, J. A., & Peterson, B. S. (2005). The circumplex model of affect: An integrative approach to affective neuroscience, cognitive development, and psychopathology. Development and Psychopathology."

[sources.superb_er]
citation = "superb/wav2vec2-base-superb-er. Hugging Face model card. Emotion recognition head on IEMOCAP with four classes."
url = "https://huggingface.co/superb/wav2vec2-base-superb-er"

[sources.emotion2vec_plus]
citation = "emotion2vec/emotion2vec_plus_large. Hugging Face model card. Nine-class speech-emotion head."
url = "https://huggingface.co/emotion2vec/emotion2vec_plus_large"

[[emotions]]
id = "neutral"
name = "Neutral"
sector = "grounded"
order = 1
valence = 0.0
arousal = 0.0
coordinate_basis = "circumplex-origin"
coordinate_note = "Design centre at the circumplex origin. Neutral is not one of Russell's 28 perimeter adjectives."
superb = "neu"
superb_in_set = true
superb_note = "Neutral is class neu in the four-class SUPERB head."
emotion2vec = "neutral"
emotion2vec_in_set = true
emotion2vec_note = "Neutral is one of the nine emotion2vec+ classes."
intensities = ["full"]
blends = [{ id = "calm", basis = "sector-neighbor" }]
texts = [
  "The notes are in the folder on the desk.",
  "Thursday at four still works.",
  "I can read that back if you want.",
]

[emotions.prosody]
pace = 1.0
energy = 1.0
breathiness = 0.15
pitch_low_ratio = "24/25"
pitch_high_ratio = "25/24"
pitch_median_ratio = "1/1"

[[emotions]]
id = "calm"
name = "Calm"
sector = "grounded"
order = 2
valence = 0.72
arousal = -0.69
coordinate_basis = "russell-1980-angle"
russell_angle_deg = 316.2
coordinate_note = "Russell 1980 places calm at 316.2 degrees. Stored pair is the unit-circle projection of that angle."
superb = "neu"
superb_in_set = false
superb_note = "SUPERB drops unbalanced IEMOCAP classes and has no calm label. Coarse projection: neu."
emotion2vec = "neutral"
emotion2vec_in_set = false
emotion2vec_note = "emotion2vec+ has no calm class. other is a residual bin, not calm. Coarse projection: neutral."
intensities = ["low", "mid", "full"]
blends = [
  { id = "neutral", basis = "sector-neighbor" },
  { id = "tender", basis = "design-adjacency" },
]
texts = [
  "We can leave it there for now.",
  "Nothing else has to move today.",
  "I'll wait while you find the page.",
]

[emotions.prosody]
pace = 0.92
energy = 0.90
breathiness = 0.32
pitch_low_ratio = "15/16"
pitch_high_ratio = "25/24"
pitch_median_ratio = "1/1"

