# Global locks above are unchanged. The A21 Piper pin above is unchanged.
# No in-tree ort, ggml, or llama. Weights are not vendored. No reference clips.
[formats.exceptions.v2s14_chatterbox]
lane = "V2-S14 clone TTS only"
runtime = "PyTorch, CPU, separate process; not linked into any Galion crate"
in_process = false
in_tree_ort = false
in_tree_ggml = false
in_tree_llama = false
weights_vendored = false
model_primary = "chatterbox-nano"
model_option = "chatterbox-turbo"
fallback = "formats.exceptions.a21_piper"
reference_clips = false
sunset = "2027-02-01"
decision = "t230u"
owner = "Maciej Grajczyk"
notes = "Sunset is 90 days from 2026-11-03. Foreign runtime stays out of process. No film audio. No celebrity clone. Do not widen this pin to ASR or an in-tree runtime."

# ---------------------------------------------------------------- UI
[ui]
rule = "one-dot"                  # the interface is one dot; nothing else on screen
dot_count = 1
dot_color = "#F5F5F7"
dot_fill = "solid"
dot_states = ["idle", "listening", "speaking"]
dot_varies = ["size", "brightness"]
background = "#0A0A0C"
gradient_from = "#F5A524"         # amber
gradient_to = "#7C3AED"           # violet
gradient_scope = "background"     # gradient never touches the dot
chrome_allowed = false            # no menus, buttons, text, orbs, faces, waveforms, logos
console_is_user_ui = false        # galion-console = developer tool (black-console look)
sources = ["BRANDING.md#one-dot (2026-11-02)", "ANSWERS-ALL-YES.md#collision-1",
           "Q-BRANDING.Q1", "Q-RENDER.Q17", "Q-RENDER.Q14"]

