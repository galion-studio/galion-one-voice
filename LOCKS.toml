onnxruntime_legacy = "1.14.1"
lane = "A21 TTS only"
in_tree_ort = false                                   # main cargo workspace: no ort crate (G3 cargo tree)
ort_crate_path = "runtimes/galion-piper-rt"           # the only manifest allowed to name ort
ort_crate_workspace = "separate"                      # own [workspace]; root Cargo.toml `exclude`s it
in_process = false
weights_vendored = false
sunset = "2027-02-01"
decision = "t123u"
decision_widen = "t613s2992"
widened_at = "2026-11-04"
owner = "Maciej Grajczyk"
