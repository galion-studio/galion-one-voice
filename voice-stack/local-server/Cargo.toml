[package]
name = "samantha-local-server"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "Loopback WebSocket server for the Samantha voice UI (swarm 16, sector S10)"
readme = "README.md"

[[bin]]
name = "samantha-local"
path = "src/main.rs"

# Pinned for rustc 1.83. Newer tokio / hyper-util manifests need edition 2024.
[features]
default = []
# Optional mouth. The default build speaks with the in-process tone or the
# clone worker. Piper is not a dependency of that build.
piper = ["dep:galion-tts-piper"]

[dependencies]
axum = { version = "=0.7.9", features = ["ws"] }
futures-util = "=0.3.31"
hyper = "=1.5.2"
hyper-util = "=0.1.10"
serde = { version = "=1.0.217", features = ["derive"] }
serde_json = "=1.0.134"
tokio = { version = "=1.43.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower = "=0.5.2"
tower-http = { version = "=0.5.2", features = ["fs"] }
galion-sam-asr = { path = "../asr" }
galion-sam-horbm = { path = "../horbm-bridge" }
galion-sam-orch = { path = "../pipeline-orchestrator" }
galion-tts-piper = { path = "../tts-piper-stream", optional = true }
horbm = { path = "../../horbm/crates/horbm" }
horbm-voice = { path = "../../horbm/crates/horbm-voice" }
samantha-voice-clone = { path = "../samantha-voice-clone" }

[dev-dependencies]
tokio-tungstenite = "=0.24.0"
