<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0A0A0C">
<title>Samantha</title>
<link rel="stylesheet" href="samantha.css">
</head>
<body data-state="idle" data-mic="off" data-link="starting" data-motion="full">
<canvas id="field" aria-hidden="true"></canvas>
<button id="talk" type="button" aria-pressed="false" aria-label="Talk to Samantha"></button>
<p id="live" class="sr" aria-live="polite"></p>
<p id="caption" aria-live="polite"></p>
<p id="notice" class="sr" role="status"></p>
<p id="help" class="sr">Samantha. The dot is the only control. Enter or Space talks. Tap again or Escape stops. The microphone stays off until you talk.</p>
<noscript><p>Samantha needs JavaScript for the dot.</p></noscript>
<script src="dot-logic.js"></script>
<script src="samantha.js"></script>
</body>
</html>
