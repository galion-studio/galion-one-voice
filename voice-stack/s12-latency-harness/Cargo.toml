[package]
name = "s12-latency-harness"
description = "Per-stage latency harness for the Samantha voice path. Standalone crate. Not a member of the root workspace."
version = "0.0.1"
edition = "2021"
license = "MIT"
publish = false
rust-version = "1.83"

[[bin]]
name = "s12-latency-harness"
path = "src/bin/s12-latency-harness.rs"

# Own workspace so this crate stays out of the root workspace members list.
[workspace]

[profile.release]
lto = false
codegen-units = 1
