[package]
name = "samantha-brain"
description = "Samantha reply bridge: ReplyEngine, a fake brain, speakable sentence chunks, and the 80 ms mood tick."
version = "0.0.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/galion-studio/galion-one-voice"
rust-version = "1.83"
publish = false
readme = "README.md"
autobins = false

[features]
default = []
# Links the `horbm` crate. Today that is the type seam in seam/horbm.
# Cargo 1.83 resolves an optional path dependency even when its feature is
# off, so this cannot point at a directory that is not in the tree yet.
# When the real crate lands, change the path below to the landing path
# (kept here so the swap is one line):
#   horbm = { path = "../../horbm/crates/horbm", optional = true }
horbm = ["dep:horbm"]

[dependencies]
horbm = { path = "seam/horbm", optional = true }

[[bin]]
name = "samantha-brain"
path = "src/bin/samantha-brain.rs"

[lib]
name = "samantha_brain"
path = "src/lib.rs"

# Own workspace so this sector stays out of the root workspace.
# The type seam is a separate package with its own `[workspace]`.
[workspace]
exclude = ["seam/horbm"]
