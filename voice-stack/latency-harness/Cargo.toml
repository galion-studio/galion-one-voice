[package]
name = "galion-sam-latency"
description = "Per-stage latency harness for the Samantha voice path. Standalone crate. Not a member of the root workspace."
version = "0.0.1"
edition = "2021"
license = "MIT"
publish = false
rust-version = "1.85"

[[bin]]
name = "galion-sam-latency"
path = "src/bin/galion-sam-latency.rs"

# Own profile note. This package is a member of `voice-stack`, not of the
# repository root workspace.
[profile.release]
lto = false
codegen-units = 1

[dependencies]
galion-sam-horbm = { path = "../horbm-bridge" }
