<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Galion</title>
<style>
  html, body { margin: 0; height: 100%; background: #0A0A0C; }
  body { display: flex; align-items: center; justify-content: center; }
  #dot {
    width: 10vh;
    height: 10vh;
    border-radius: 50%;
    background: #F5F5F7;
  }
  #dbg[hidden] { display: none; }
  #dbg {
    position: absolute;
    left: 12px;
    right: 12px;
    bottom: 12px;
    margin: 0;
    color: #F5F5F7;
    font: 12px/1.4 ui-monospace, monospace;
    white-space: pre-wrap;
  }
</style>
</head>
<body>
<div id="dot"></div>
<pre id="dbg" hidden></pre>
<script src="/dot.js"></script>
</body>
</html>
