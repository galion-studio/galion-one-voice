[package]
name = "galion-sam-horbm"
description = "The HORBM bridge: ReplyEngine, read-only cards, and the linked horbm turn."
version = "0.0.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/galion-studio/galion-one-voice"
rust-version = "1.85"
publish = false
readme = "README.md"
autobins = false

[features]
default = []
# Compiles `HorbmEngine`, the `Brain::open` / `turn` adapter. The `horbm`
# crate is a normal dependency either way. The live 7881 turn uses it.
horbm = []

[dependencies]
galion-research-gateway = { path = "../research-gateway" }
horbm = { path = "../../horbm/crates/horbm" }
serde_json = "1"

[[bin]]
name = "galion-sam-horbm"
path = "src/bin/galion-sam-horbm.rs"

[lib]
name = "galion_sam_horbm"
path = "src/lib.rs"

# Member of voice-stack/Cargo.toml, not of the root workspace.
# Crate `horbm` is the path dependency above. archive/2026-11-24/voice-stack/horbm-bridge/seam/horbm is the old type seam and is not linked.
