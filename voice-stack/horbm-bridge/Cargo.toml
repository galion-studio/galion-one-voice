[package]
name = "galion-sam-horbm"
description = "Samantha HORBM bridge: ReplyEngine, a fake brain, speakable sentence chunks, and an empty 80 ms tick."
version = "0.0.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/galion-studio/galion-one-voice"
rust-version = "1.83"
publish = false
readme = "README.md"
autobins = false

[features]
default = []
# Links the `horbm` crate. Today that is the type seam in seam/horbm.
# Cargo 1.83 resolves an optional path dependency even when its feature is
# off, so this cannot point at a directory that is not in the tree yet.
# When the real crate lands, change the path below to the landing path
# (kept here so the swap is one line):
#   horbm = { path = "../../horbm/crates/horbm", optional = true }
horbm = ["dep:horbm"]

[dependencies]
galion-research-gateway = { path = "../research-gateway" }
horbm = { path = "seam/horbm", optional = true }
serde_json = "1"

[[bin]]
name = "galion-sam-horbm"
path = "src/bin/galion-sam-horbm.rs"

[lib]
name = "galion_sam_horbm"
path = "src/lib.rs"

# Member of voice-stack/Cargo.toml, not of the root workspace.
# The type seam in seam/horbm is a path dependency. It is not the retrieval brain.
