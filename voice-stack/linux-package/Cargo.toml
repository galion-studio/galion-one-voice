[package]
name = "galion-samantha"
description = "Loopback supervisor for the local Samantha voice companion. Separate workspace. HORBM is not linked."
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
readme = "README.md"

[[bin]]
name = "galion-samantha"
path = "src/main.rs"

# Own workspace on purpose, same shape as runtimes/galion-piper-rt.
# Not a member of the repository workspace. Do not add it there.
[workspace]

[profile.release]
opt-level = 3
lto = false
codegen-units = 1
