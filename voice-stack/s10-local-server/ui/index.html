<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0B0F14">
  <title>Samantha</title>
  <link rel="stylesheet" href="dot.css">
</head>
<body>
  <canvas id="s" data-mark="orb" data-profile="luti" data-persona="samantha" data-mouth="hold" data-film-voice="false" data-rights="hold"></canvas>
  <p id="caption" aria-live="polite"></p>
  <p id="live" class="sr" aria-live="polite"></p>
  <form id="line">
    <button id="listen" type="button">Listen</button>
    <input id="say" type="text" name="say" autocomplete="off" maxlength="2000" placeholder="Say it here, or tap Listen" aria-label="Line to Samantha">
  </form>
  <script src="app.js"></script>
</body>
</html>
