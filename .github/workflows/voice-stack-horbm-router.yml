# Layer 5 router and the localhost research gateway.
# The end-to-end step downloads the Silero VAD ONNX (MIT, not a voice) into
# the runner cache. It does not download a voice model. libssl-dev is only
# there because that ONNX Runtime pin fetches its CPU build over native-tls.
# g++ supplies libstdc++, which that CPU build links.

name: voice-stack horbm router

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: router, gateway, pipeline
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: clippy
      - name: ALSA headers
        run: sudo apt-get update && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y libasound2-dev pkg-config libflite1 libssl-dev g++
      - name: cargo build
        run: |
          cargo build --manifest-path horbm/Cargo.toml -p horbm -p horbm-eval
          cargo build --manifest-path voice-stack/Cargo.toml -p galion-sam-horbm -p samantha-local-server
      - name: cargo test
        run: |
          cargo test --manifest-path horbm/Cargo.toml -p horbm -p horbm-eval
          cargo run --manifest-path horbm/Cargo.toml -p horbm-eval --quiet
          cargo test --manifest-path horbm/Cargo.toml -p horbm-duplex
          cargo test --manifest-path voice-stack/Cargo.toml -p galion-research-gateway -p galion-sam-horbm -p galion-sam-orch -p samantha-local-server
          cargo test --manifest-path voice-stack/Cargo.toml -p galion-sam-horbm --features horbm
      - name: cargo clippy
        run: |
          cargo clippy --manifest-path horbm/Cargo.toml -p horbm -p horbm-eval --all-targets -- -D warnings
          cargo clippy --manifest-path horbm/Cargo.toml -p horbm-duplex --all-targets -- -D warnings
          cargo clippy --manifest-path voice-stack/Cargo.toml -p galion-research-gateway -p galion-sam-horbm -p samantha-local-server --all-targets --no-deps -- -D warnings
          cargo clippy --manifest-path voice-stack/Cargo.toml -p galion-sam-horbm --all-targets --no-deps --features horbm -- -D warnings
          cargo clippy --manifest-path voice-stack/audio-io/Cargo.toml --all-targets --no-deps -- -D warnings
      - name: HORBM end-to-end smoke
        run: bash scripts/horbm-e2e-smoke.sh
