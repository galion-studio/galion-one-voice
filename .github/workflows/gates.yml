# PR checks for the V2 track. Tests and lock gates only. No deploy, no SSH.
name: gates

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - name: Eureka locks
        run: scripts/check-locks.sh
      - name: Forbidden formats and runtimes
        run: scripts/check-no-forbidden.sh
      - name: Release manifest and stage unit label
        run: |
          if ! command -v jq >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y jq
          fi
          scripts/deploy/write-release-manifest.test.sh
      - name: Workspace tests
        run: cargo test --workspace
      - name: Emotion V2 reference checker
        run: cargo test --manifest-path tools/emotion-v2/refcheck/Cargo.toml
      - name: Symphony articulation layer (synthetic signals, no audio)
        run: cargo test --manifest-path tools/symphony/articulation/Cargo.toml
      - name: Emotion render controls (synthetic, no audio)
        run: cargo test --manifest-path tools/symphony/emotion-render/Cargo.toml
      - name: Symphony lungs layer (synthetic signals, no audio)
        run: cargo test --manifest-path tools/symphony/lungs/Cargo.toml
      - name: Voice V2 pipeline (synthetic tones, no download)
        run: cargo test --manifest-path tools/symphony/voice-v2/Cargo.toml
      - name: One-percent symphony gate
        run: galion-gates/op-one-percent.sh
      - name: Clone worker scaffold (no weight download)
        run: cargo test -p galion-ml-voice --features speech
      - name: Clone prep staging (no download, no generate)
        run: scripts/clone/stage-clone-prep.test.sh
      - name: Speaking rate changes the PCM
        run: python3 scripts/clone/test_speaking_rate.py
      - name: Flash TTFA harness (no number without a run)
        run: scripts/eval/flash-ttfa.sh
      - name: Hard loop classifiers (no product verdict)
        run: scripts/eval/v2-hard-loop.sh --self-check
      - name: Jarvis hub texture (toggle and band check)
        run: scripts/eval/jarvis-texture.sh
      - name: Stream TTFA (stub 15 ms fails; Piper is the live path)
        run: |
          set +e
          scripts/eval/clone-stream-ttfa.sh
          code=$?
          if [ "$code" = 2 ]; then
            echo "NOT A HARD-PASS. No Piper pack on this runner. Stub clock is FAIL and product_claim is false. Live path is scripts/eval/piper-stream-ttfa.sh when the A21 pack is present."
            exit 0
          fi
          exit "$code"
      - name: Original-ref Nano TTFA (stub is FAIL; no PCM is BLOCKED)
        run: |
          python3 scripts/eval/test_nano_original_ref_ttfa.py
          set +e
          scripts/eval/nano-original-ref-ttfa.sh
          code=$?
          set -e
          if [ "$code" = 2 ]; then
            echo "BLOCKED. Original-ref Nano PCM was not measured. Not a product TTFA. 80 ms is not claimed."
            exit 0
          fi
          exit "$code"
      - name: Phone HTTP surface
        run: cargo test -p galion-render --features web --lib
      - name: Phone lane
        run: cargo test -p galion-cascade --features cascade --lib
      - name: Turn worker
        run: cargo test -p galion-console --features phone-turn --lib
      - name: Presence-eval virtual user
        run: scripts/eval/virtual-user.sh
