# PR checks for the V2 track. Tests and lock gates only. No deploy, no SSH.
name: gates

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - name: Eureka locks
        run: scripts/check-locks.sh
      - name: Forbidden formats and runtimes
        run: scripts/check-no-forbidden.sh
      - name: Workspace tests
        run: cargo test --workspace
      - name: Clone worker scaffold (no weight download)
        run: cargo test -p galion-ml-voice --features speech
      - name: Flash TTFA harness (no number without a run)
        run: scripts/eval/flash-ttfa.sh
      - name: Stream TTFA (stub 15 ms fails; Piper is the live path)
        run: |
          set +e
          scripts/eval/clone-stream-ttfa.sh
          code=$?
          if [ "$code" = 2 ]; then
            echo "NOT A HARD-PASS. No Piper pack on this runner. Stub clock is FAIL and product_claim is false. Live path is scripts/eval/piper-stream-ttfa.sh when the A21 pack is present."
            exit 0
          fi
          exit "$code"
      - name: Phone HTTP surface
        run: cargo test -p galion-render --features web --lib
      - name: Phone lane
        run: cargo test -p galion-cascade --features cascade --lib
      - name: Turn worker
        run: cargo test -p galion-console --features phone-turn --lib
      - name: Presence-eval virtual user
        run: scripts/eval/virtual-user.sh
