# Shellcheck and offline install tests for voice-stack/linux-package.
# No model download. No deploy.

name: voice-stack linux-package

on:
  pull_request:
  push:
    branches: [main]

jobs:
  package:
    name: shellcheck, unit, install tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          # The Ubuntu runner image ships Microsoft apt sources. When
          # packages.microsoft.com answers 403, apt-get update exits 100
          # before shellcheck is installed. Nothing in this job uses them.
          sudo rm -f \
            /etc/apt/sources.list.d/microsoft-prod.list \
            /etc/apt/sources.list.d/microsoft-prod.sources \
            /etc/apt/sources.list.d/azure-cli.list \
            /etc/apt/sources.list.d/azure-cli.sources
          sudo apt-get update
          sudo apt-get install -y shellcheck
          voice-stack/linux-package/ci/shellcheck.sh
      - name: systemd user unit
        run: voice-stack/linux-package/ci/verify-unit.sh
      - uses: dtolnay/rust-toolchain@1.85.0
      - name: cargo tests and install tests
        run: make -C voice-stack/linux-package test
