# Desktop Playwright for /one. No deploy.
name: one-desktop

on:
  pull_request:
  push:
    branches: [main]

jobs:
  playwright:
    # ubuntu-latest is 26.04. Playwright 1.56.1 refuses Chromium there.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: e2e/one
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm ci
      - name: Chromium
        run: npx playwright install --with-deps chromium
      - name: Desktop /one
        run: npx playwright test
