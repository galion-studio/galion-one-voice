[package]
name = "galion-conductor"
description = "HORBM conductor. Eager end-of-turn, epoch rollback, barge-in at the 200 ms lock, wordless reaction, and a Galion Research side band capped at 3 s on the virtual clock. Does not call the heartbeat frame function."
version = "0.0.1"
edition = "2021"
license = "MIT"
publish = false
rust-version = "1.83"

[dependencies]
# Own workspace, same pattern as tools/symphony/feeling.
# galion-mne-contract is itself a workspace root, so it cannot be a path
# dependency of a root-workspace member.
galion-mne-contract = { path = "../../tools/symphony/mne-contract" }

[features]
default = []

[workspace]
