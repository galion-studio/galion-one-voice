[package]
name = "horbm-retrieval"
description = "Phase 2 retrieval thread: in-process FTS5 over galion-knowledge cards, RAM only, consent deny by default."
version = "0.0.1"
edition = "2021"
license = "MIT"
publish = false
rust-version = "1.83"

[dependencies]
arc-swap = "1.7"
horbm-memory = { path = "../../third_party/horbm-memory" }
rusqlite = { version = "0.32.1", features = ["bundled"] }
serde_json = "1"
sha2 = "0.10"

[[bin]]
name = "horbm-retrieval"
path = "src/bin/horbm-retrieval.rs"
