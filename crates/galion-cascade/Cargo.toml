# Galion Voice — Perpetual Open MIT License
[package]
name = "galion-cascade"
description = "Galion Voice cascade fallback lane (W20-10, sector 11): ASR -> small LLM -> TTS trait stubs. EN only, no weights, .gq only. The S0 probe reads a gitignored .gq through galion-tensor and does not speak one."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version = "1.85"
publish = false

[features]
# Fallback lane is never default (A18).
# W21-03: `cascade` also enables the EN demo lane (adapters onto galion-ml-voice stubs).
cascade = ["dep:galion-ml-voice", "galion-ml-voice/speech", "dep:galion-asr-vosk"]
# V1-03: the EN lane speaks real words (A21 weight slot -> interim libflite via runtime dlopen).

[dependencies]
# Default build stays offline: galion-tensor with rayon off is std-only.
# It is the S0 .gq reader. This crate does not download or write weights.
galion-tensor = { path = "../galion-tensor", default-features = false }
# Locked 80 ms quantum for the domain 04 stamp line. Default features stay off
# so the presence harness is not pulled into the cascade.
galion-heartbeat = { path = "../galion-heartbeat", default-features = false }
# W21-03: optional path dep (workspace-local, offline, zero transitive deps).
galion-ml-voice = { path = "../galion-ml-voice", optional = true }
galion-asr-vosk = { path = "../galion-asr-vosk", optional = true }

[[example]]
name = "domain04_dry_run"

[[example]]
name = "student_probe"

[[example]]
name = "en_cascade"
required-features = ["cascade"]

[[example]]
name = "phone_turn"
required-features = ["cascade"]

[[example]]
name = "reply_latency"
required-features = ["cascade"]
