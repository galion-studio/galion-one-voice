# Galion Voice — Perpetual Open MIT License
[package]
name = "galion-ml-voice"
description = "Galion Voice English scaffold and the symphony voice-clip compiler. Clone PCM becomes a .gq clip the CPU cascade loads."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version = "1.85"
publish = false

[features]
# V1-03: real-speech path (A21 weight slot + interim system TTS via runtime dlopen of
# libflite). Off by default: the default build stays no-I/O, no FFI.
speech = ["dep:galion-heartbeat"]

[[example]]
name = "piper_warmth"
required-features = ["speech"]

[[example]]
name = "flash_ttfa"
required-features = ["speech"]

[[example]]
name = "gqvoice"
required-features = ["speech"]

[dependencies]
# Reader only. Default features stay off so this crate does not pull rayon.
# The .gq writer for voice clips lives here, not in galion-tensor.
galion-tensor = { path = "../galion-tensor", default-features = false }
galion-heartbeat = { path = "../galion-heartbeat", optional = true, default-features = false }

[dev-dependencies]
galion-heartbeat = { path = "../galion-heartbeat", default-features = false }

[[bin]]
name = "galion-voice-compile"
path = "src/bin/galion-voice-compile.rs"
