# End-of-turn thresholds for the ear prosody scorer.
# One frame is 80 ms. This file is compiled in with include_str.
# Nothing here is read from a machine path at runtime.
#
# The word lists follow voice-stack/vad/src/turn.rs (the live hangover).
# Fillers and unfinished words hold the floor. A terminal contour does not
# override them until hold_pause_ms. That is how a thinking pause stays open.

fall_semitones = 1.2
strong_fall_semitones = 4.0
rise_semitones = 1.5
energy_ratio = 0.65
yield_pause_ms = 80
mild_pause_ms = 160
hold_pause_ms = 720
min_voiced = 3
trail = 4
pace_min_hz = 1.5
pace_drop_ratio = 0.5

fillers = ["um", "uh", "er", "erm", "hmm", "ah", "uhm", "umm", "mm"]
unfinished = ["and", "but", "or", "so", "because", "cause", "the", "a", "an", "to", "of", "in", "on", "at", "with", "for", "from", "my", "your", "his", "her", "their", "our", "like", "that", "which", "who", "if", "when", "while", "then", "is", "are", "was", "were", "i", "i'm", "we", "you", "it's", "this", "about", "into", "than", "as", "by", "not", "very"]
