<!doctype html>
<!-- Galion Voice — Perpetual Open MIT License. (c) 2026 Maciej Grajczyk.
     V1-01 single screen: the one dot on the Galion OS background. Nothing else.
     Polls /dot every 80 ms (one heartbeat frame); draws exactly what the heartbeat says.
     Click / double-click / F / Enter = fullscreen (no visible control). -->
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A0A0C"><title>Galion Voice</title>
<style>html,body{margin:0;width:100%;height:100%;background:#0A0A0C;overflow:hidden;cursor:none;user-select:none}
canvas{display:block;position:fixed;inset:0;width:100vw;height:100vh}</style></head>
<body><canvas id="s"></canvas><script>
"use strict";
// Brand tokens (BRANDING.md V4 / LOCKS [ui]); /dot overrides them per frame.
const TOK={dot:"#F5F5F7",base:"#0A0A0C",from:"#F5A524",to:"#7C3AED"};
const WASH=0.38, WASH_MS=24000, IDLE_MS=1600, BW=96, BH=54;
const hex=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const okHex=h=>typeof h==="string"&&/^#[0-9A-Fa-f]{6}$/.test(h);
const lerp=(a,b,t)=>a.map((x,i)=>Math.round(x+(b[i]-x)*t));
const cv=document.getElementById("s"), cx=cv.getContext("2d",{alpha:false});
const bg=document.createElement("canvas"); bg.width=BW; bg.height=BH;
const bx=bg.getContext("2d"), img=bx.createImageData(BW,BH);
let latest=null, lastOk=0, t0=performance.now();

// Port of galion-render palette::background_at — background only, never the dot.
function paintBg(tms,b){
  const base=hex(b.base),A=hex(b.from),V=hex(b.to);
  const ph=(tms%WASH_MS)/WASH_MS*2*Math.PI, drift=0.15*Math.sin(ph), d=img.data;
  for(let y=0;y<BH;y++){const v=(y+.5)/BH;
    for(let x=0;x<BW;x++){const u=(x+.5)/BW;
      const ramp=Math.min(1,Math.max(0,.5*(u+v)+drift)), hue=lerp(A,V,ramp);
      const du=u-.5,dv=v-.5, r=Math.sqrt(du*du+dv*dv)/Math.SQRT1_2, vg=Math.max(0,1-r);
      const c=lerp(base,hue,WASH*vg*vg), k=(y*BW+x)*4;
      d[k]=c[0];d[k+1]=c[1];d[k+2]=c[2];d[k+3]=255;}}
  bx.putImageData(img,0,0);
}
// Fallback when the heartbeat is unreachable: plain idle pulse (galion-render dot.rs Idle).
function idleLocal(){const t=performance.now()-t0, s=Math.sin(((t%IDLE_MS)/IDLE_MS)*2*Math.PI);
  const k=0.84+0.03*s, c=hex(TOK.dot).map(x=>Math.round(x*k));
  return {t_ms:Math.floor(t),radius:0.100+0.006*s,
    dot:"#"+c.map(x=>x.toString(16).padStart(2,"0")).join(""),bg:TOK};}

function draw(){
  const live=latest&&performance.now()-lastOk<1000;
  const f=live?latest:idleLocal();
  const dpr=window.devicePixelRatio||1, W=Math.round(innerWidth*dpr), H=Math.round(innerHeight*dpr);
  if(cv.width!==W||cv.height!==H){cv.width=W;cv.height=H;}
  const b=(f.bg&&okHex(f.bg.base)&&okHex(f.bg.from)&&okHex(f.bg.to))?f.bg:TOK;
  paintBg(f.t_ms|0,b);
  cx.imageSmoothingEnabled=true; cx.imageSmoothingQuality="high"; cx.drawImage(bg,0,0,W,H);
  const r=Math.min(.5,Math.max(0,+f.radius||0))*Math.min(W,H);
  cx.fillStyle=okHex(f.dot)?f.dot:TOK.dot;           // one flat neutral colour, no glow
  cx.beginPath(); cx.arc(W/2,H/2,r,0,2*Math.PI); cx.fill();
  requestAnimationFrame(draw);
}
async function poll(){
  const t=performance.now();
  try{const r=await fetch("dot",{cache:"no-store"}); const j=await r.json();
    if(j&&typeof j.radius==="number"){latest=j;lastOk=performance.now();}}catch(e){}
  setTimeout(poll,Math.max(0,80-(performance.now()-t)));   // one heartbeat frame
}
function fs(){const d=document.documentElement; if(!document.fullscreenElement&&d.requestFullscreen)d.requestFullscreen().catch(()=>{});}
addEventListener("click",fs); addEventListener("dblclick",fs);
addEventListener("keydown",e=>{if(e.key==="f"||e.key==="F"||e.key==="Enter")fs();});
poll(); requestAnimationFrame(draw);
</script></body></html>
