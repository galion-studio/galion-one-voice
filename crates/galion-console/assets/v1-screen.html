<!doctype html>
<!-- Galion Voice — Perpetual Open MIT License. (c) 2026 Maciej Grajczyk.
     One screen: one dot. Mobile-safe. Tap the dot → mic. A text box sits under it.
     Typed lines go to the persona floor and come back as Piper audio on /reply.
     UX-01: the page animates on its own 60 fps clock from /dot {mode,level} (no 80 ms stutter),
     listening = larger + full bright + still; speaking = smaller base, pulsing; idle = slow breath;
     server unreachable = small dim still dot (never mistaken for idle).
     V2 orb: the same one mark, a calm circle on a soft spring (idle / listen / think / speak).
     Fill is the locked near-white #F5F5F7 (a quiet gradient around that pigment, 1px hairline).
     Brightness is glow and a little size — it does not multiply the fill.
     Aspect stays 1. Speak radius follows a low-passed reply envelope, not an ellipse.
     Interior warmth follows GET /dot "emotion" (live heartbeat AffectFeed), via StubExpressor.
     V1 voice pipeline (supersedes the UX-01 "no raw audio leaves the page" note, per Maciej):
       mic level  → POST /mic  {rms,t[,playing]} every ~80 ms (drives the dot, unchanged)
       utterance  → POST /turn  audio/wav (16 kHz mono 16-bit PCM), cut on-device by VAD
                    (~640 ms quiet after speech). That end is the auto-record. proceedTurn
                    posts the same /turn with X-Galion-Proceed: auto. No second page.
                    Headers: X-Turn-Id, X-Sample-Rate, X-Barge-In, X-Galion-Proceed.
       reply      ← /dot JSON gains reply:{id,url,ms}; page fetches the WAV and plays it through
                    the AudioContext unlocked by the tap. User speech during playback = barge-in:
                    playback stops at once and the new utterance is captured.
     V2-S3: AI Act Art. 50 disclosure (HR+EN) is visible and spoken on the first tap.
     The session token comes from POST /session's body and is never put in the URL. -->
<html lang="en"><head><meta charset="utf-8">

<body>
<canvas id="s" data-mark="orb" data-profile="luti" data-persona="samantha" data-mouth="piper" data-film-voice="false" data-rights="hold"></canvas>
<!--galion-ai-disclosure-->
<div id="ai-disclosure" role="note">
  <span lang="hr">Razgovarate s umjetnom inteligencijom. Galion je AI asistent, a ne osoba.</span>
  <span lang="en">You are talking to an AI. Galion is an AI assistant, not a person.</span>
  <span class="hold">This voice is not a film clone.</span>
</div>
<!--/galion-ai-disclosure-->
<div id="hint">Tap the dot to talk, or type below</div>
<form id="say" autocomplete="off">
  <input id="say-text" type="text" name="text" enterkeyhint="send" maxlength="400" placeholder="Type to Galion" aria-label="Message" autocapitalize="sentences">
  <button type="submit">Send</button>
</form>
<div id="err" role="status" aria-live="polite"></div>
<script>
"use strict";
const TOK={dot:"#F5F5F7",base:"#0A0A0C",from:"#F5A524",to:"#7C3AED"};
// Body of the mark is the locked token. Edge is a whisper darker, still the same pigment.
// Stroke is a 1-device-pixel hairline. Brightness never scales these channels.
const MARK={core:"#F5F5F7",edge:"#E8E8ED",stroke:"rgba(255,255,255,0.55)",strokePx:1};
const WASH=0.38, WASH_MS=24000, IDLE_MS=1600, BW=96, BH=54;
// Radius fractions mirror galion-render DotParams scale. Brightness here is glow (0..1), not pigment.
const R={idle:0.100, listen:0.135, speak:0.105, speakDepth:0.028, off:0.060};
const B={idle:0.48, listen:0.72, off:0.08};
const POLL_MS=80, MAX_INFLIGHT=3, FETCH_TIMEOUT_MS=1200, OFFLINE_MS=1500;
const HOLD_IDLE_MS=300, HOLD_LEAVE_SPEAK_MS=160, LOCAL_VOICE=0.02;
// Soft springs. Same aims as OrbMotion::radius_gain. Eased — a mode change does not rebind in one frame.
const GAIN_TAU=480, TARGET_TAU=140, ENV_ATTACK=200, ENV_RELEASE=380, EM_TAU=520;
const hex=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const okHex=h=>typeof h==="string"&&/^#[0-9A-Fa-f]{6}$/.test(h);
const lerp=(a,b,t)=>a.map((x,i)=>Math.round(x+(b[i]-x)*t));
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const cv=document.getElementById("s"), cx=cv.getContext("2d",{alpha:false});
const bg=document.createElement("canvas"); bg.width=BW; bg.height=BH;
const bx=bg.getContext("2d"), img=bx.createImageData(BW,BH);
const hint=document.getElementById("hint"), errEl=document.getElementById("err");
const t0=performance.now();
let latest=null, lastOk=0, lastT=-1, inflight=0, everOk=false;
let shown="idle", cand="idle", candSince=0;          // displayed mode + hysteresis
let lastFrame=performance.now();
let micState="off"; // off | pending | on | denied
let micStream=null, micCtx=null, micAnalyser=null, micData=null, micRms=0, micFloor=0.004, micPosting=false;
// Capture / VAD / playback state (see voice pipeline section below).
const CAP_SR=16000, VAD_FRAME=320;                     // 20 ms frames at 16 kHz
const VAD_START_MS=80, VAD_BARGE_MS=200, VAD_END_MS=640, PREROLL_MS=300;
const MIN_SPEECH_MS=240, MAX_UTT_MS=15000, VAD_ABS=0.012, VAD_FLOOR_X=3.0, VAD_PLAY_X=2.0;
let capNode=null, capSink=null, capRatio=1, capPos=0, capFrame=new Float32Array(VAD_FRAME), capFill=0;
let vadFloor=0.003, vadOn=false, vadRun=0, vadQuiet=0, vadSpeechMs=0, uttMs=0, uttBarge=false;
let preroll=[], utt=[], turnSeq=0;
let playSrc=null, playId=null, playing=false, seenReplies=new Set();
// V2 orb: spring state. Gains ease from the idle aim. No aspect — the mark is a circle.
const LUTI={idle:{w:1.8,z:0.92},listening:{w:3.4,z:0.88},thinking:{w:2.4,z:0.90},speaking:{w:3.0,z:0.92},offline:{w:2.0,z:1.02}};
const SPRING=LUTI;
const LUTI_COST=48;
let rP=R.idle, rV=0, bP=B.idle, bV=0, wS=SPRING.idle.w, zS=SPRING.idle.z;
let trLp=R.idle, tbLp=B.idle, micEnv=0, playEnv=0, turnsInFlight=0;
let emV=0.30, emA=0.35, emLean=0, liveLp=0;
let playAn=null, playData=null;
let sessionToken="";
let hearReplies=false;

function sessionHeaders(extra){
  const h={"ngrok-skip-browser-warning":"1"};
  if(extra) Object.assign(h, extra);
  if(sessionToken) h["X-Galion-Session"]=sessionToken;
  return h;
}
async function ensureSession(){
  if(sessionToken) return;
  try{
    const r=await fetch("session",{method:"POST",cache:"no-store",
      headers:{"Content-Type":"application/json","ngrok-skip-browser-warning":"1"},
      body:"{\"op\":\"open\"}"});
    if(!r.ok) return;
    const j=await r.json();
    if(j&&typeof j.token==="string") sessionToken=j.token;
  }catch(e){}
}
function discloseAi(){
  const el=document.getElementById("ai-disclosure");
  if(!el||el.getAttribute("data-spoken")==="1") return;
  el.setAttribute("data-spoken","1");
  try{
    if(!window.speechSynthesis||!window.SpeechSynthesisUtterance) return;
    const hr=el.querySelector('[lang="hr"]'), en=el.querySelector('[lang="en"]');
    speechSynthesis.cancel();
    if(hr&&hr.textContent){ const u=new SpeechSynthesisUtterance(hr.textContent.trim()); u.lang="hr-HR"; speechSynthesis.speak(u); }
    if(en&&en.textContent){ const u=new SpeechSynthesisUtterance(en.textContent.trim()); u.lang="en-GB"; speechSynthesis.speak(u); }
  }catch(e){}
}

// Surround + interior targets. The disc body stays #F5F5F7. These only move the wash.
const MOOD={
  calm:{wash:0.38,amber:0.46,warm:0.30},
  grief:{wash:0.58,amber:0.08,warm:0.14},
  joy:{wash:0.66,amber:0.84,warm:0.62},
  vulnerability:{wash:0.44,amber:0.22,warm:0.20},
  quiet:{wash:0.20,amber:0.28,warm:0.24}
};
let moodWash=0.38, moodAmber=0.46;
function paintBg(tms,b){
  const base=hex(b.base),A=hex(b.from),V=hex(b.to);
  const ph=(tms%WASH_MS)/WASH_MS*2*Math.PI, drift=0.15*Math.sin(ph), d=img.data;
  for(let y=0;y<BH;y++){const v=(y+.5)/BH;
    for(let x=0;x<BW;x++){const u=(x+.5)/BW;
      const ramp=Math.min(1,Math.max(0,.5*(u+v)+drift));
      const hue=lerp(V,A,Math.min(1,Math.max(0,ramp*0.35+moodAmber*0.75)));
      const du=u-.5,dv=v-.5, r=Math.sqrt(du*du+dv*dv)/Math.SQRT1_2, vg=Math.max(0,1-r);
      const c=lerp(base,hue,moodWash*vg*vg), k=(y*BW+x)*4;
      d[k]=c[0];d[k+1]=c[1];d[k+2]=c[2];d[k+3]=255;}}
  bx.putImageData(img,0,0);
}

// Server mode → displayed mode with hysteresis, local mic preempt, offline state.
function pickMode(now){
  if(now-lastOk>OFFLINE_MS) return "offline";
  let m=(latest&&latest.mode)||latest&&latest.state||"idle";
  if(m==="rika") m="idle"; // lean-in stays idle motion; /dot "lean" carries the feeling
  if(m!=="idle"&&m!=="listening"&&m!=="speaking"&&m!=="thinking") m="idle";
  if(playing) m="speaking";                          // our own reply audio is audible right now
  const localVoice=micState==="on"&&(micRms-micFloor*1.6)>LOCAL_VOICE;
  if(localVoice&&m!=="speaking") m="listening";   // instant feedback, before the round trip
  if(turnsInFlight>0&&!playing&&!vadOn&&micState==="on"&&m!=="listening"&&m!=="speaking") m="thinking";
  if(m!==cand){cand=m;candSince=now;}
  const held=now-candSince;
  if(cand===shown) return shown;
  if(shown==="offline"||cand==="speaking"||cand==="thinking"||cand==="listening"&&shown!=="speaking") return cand;
  if(shown==="speaking"&&held<HOLD_LEAVE_SPEAK_MS) return shown;
  if(cand==="idle"&&held<HOLD_IDLE_MS) return shown;
  return cand;
}

// Semi-implicit Euler spring-damper. dt is milliseconds.
function spring(p,v,target,dt,w,z){
  const h=Math.min(0.05,Math.max(0.001,dt/1000));
  const a=-w*w*(p-target)-2*z*w*v;
  v+=a*h; p+=v*h;
  if(!isFinite(p)||!isFinite(v)) return [target,0];
  return [p,v];
}
// Low-passed envelope of the WAV in the speakers (0..1). Silence stays near rest.
function samplePlayEnv(dt){
  let e=0;
  if(playing&&playAn&&playData){
    playAn.getByteTimeDomainData(playData);
    let sum=0;
    for(let i=0;i<playData.length;i++){ const v=(playData[i]-128)/128; sum+=v*v; }
    e=clamp(Math.sqrt(sum/playData.length)*3.2,0,1);
  }
  const tc=e>playEnv?ENV_ATTACK:ENV_RELEASE;
  playEnv+=(e-playEnv)*(1-Math.exp(-Math.max(1,dt)/tc));
  if(playEnv<1e-4) playEnv=0;
  return playEnv;
}
// Galion's feeling, not a mirror. Same table as galion_emotion::StubExpressor
// (dominance defaults to 0.5, so high-arousal negative reads as Angry → calm).
// Valence near 0 is "no opinion" (loudness SENSE): stay neutral-warm, keep live arousal.
function empathy(em){
  if(!em||em.sense===false) return {v:0.30,a:0.35,live:0};
  const v=clamp(+em.valence||0,-1,1), a=clamp(+em.arousal||0,0,1);
  if(Math.abs(v)<0.05) return {v:0.30,a:0.35,live:a};
  if(v>=0.25) return {v:Math.max(v*0.9,0.30), a:Math.max(a*0.85,0.35), live:a};
  if(v<=-0.25&&a>=0.6) return {v:0.20,a:0.20,live:a};
  if(v<=-0.25) return {v:0.25,a:0.20,live:a};
  return {v:0.30,a:0.35,live:a};
}
// Inner highlight only. Stays inside 240..255 so the disc still reads as #F5F5F7.
function markInner(warm){
  const w=clamp(warm,0,1);
  return [Math.round(246+9*w), Math.round(246+6*w), Math.round(252-12*w)];
}
function target(mode,now,dt){
  const t=now-t0;
  micEnv+=(clamp(micRms,0,1)-micEnv)*(1-Math.exp(-Math.max(1,dt)/200));
  const env=samplePlayEnv(dt);
  if(mode==="offline") return [R.off,B.off];
  if(mode==="listening"){
    const local=clamp((micRms-micFloor)*6,0,1);
    const lv=Math.max(clamp(+(latest&&latest.level)||0,0,1), local, micEnv*2.5);
    return [R.listen+0.028*lv+0.004*Math.sin(t/1100), B.listen+0.16*lv];
  }
  if(mode==="thinking"){
    const s=0.5+0.5*Math.sin(t/1100);
    return [0.108+0.008*s, 0.50+0.10*s];
  }
  if(mode==="speaking"){
    const breath=Math.sin(t/1400);
    if(playing) return [R.speak+R.speakDepth*env+0.006*breath, 0.40+0.32*env];
    if(latest&&typeof latest.radius==="number"&&(latest.mode==="speaking"||latest.state==="speaking"))
      return [clamp(+latest.radius,0,0.5), 0.40+0.28*clamp(+latest.brightness||0.8,0,1)];
    const s=Math.sin(((t%2800)/2800)*2*Math.PI);
    return [R.speak+0.012*s, 0.46+0.08*s];
  }
  const s=Math.sin(((t%IDLE_MS)/IDLE_MS)*2*Math.PI);
  const lean=clamp(+(latest&&latest.lean)||0,0,1);
  return [R.idle+0.010*s+0.016*lean, B.idle+0.08*s+0.12*lean];
}

function draw(){
  const now=performance.now(), dt=Math.min(50,now-lastFrame); lastFrame=now;
  shown=pickMode(now);
  const [tr,tb]=target(shown,now,dt);
  const aim=SPRING[shown]||SPRING.idle;
  const gk=1-Math.exp(-dt/GAIN_TAU);
  wS+=(aim.w-wS)*gk; zS+=(aim.z-zS)*gk;
  const tk=1-Math.exp(-dt/TARGET_TAU);
  trLp+=(tr-trLp)*tk; tbLp+=(tb-tbLp)*tk;
  [rP,rV]=spring(rP,rV,trLp,dt,wS,zS);
  [bP,bV]=spring(bP,bV,tbLp,dt,wS*0.85,Math.min(1.2,zS+0.08));
  const feel=empathy(latest&&latest.emotion);
  const moodName=(latest&&MOOD[latest.mood])?latest.mood:"calm";
  const moodT=MOOD[moodName];
  const mk=1-Math.exp(-dt/EM_TAU);
  moodWash+=(moodT.wash-moodWash)*mk;
  moodAmber+=(moodT.amber-moodAmber)*mk;
  if(latest&&latest.mood){ feel.v=moodT.warm; feel.a=Math.min(1,moodT.wash); }
  cv.dataset.mood=moodName;
  const leanNow=clamp(+((latest&&latest.emotion&&latest.emotion.lean)!=null?latest.emotion.lean:(latest&&latest.lean)||0),0,1);
  const ek=1-Math.exp(-dt/EM_TAU);
  emV+=(feel.v-emV)*ek; emA+=(feel.a-emA)*ek; emLean+=(leanNow-emLean)*ek;
  liveLp+=(feel.live-liveLp)*ek;
  const dpr=Math.min(window.devicePixelRatio||1, 3);
  const W=Math.round(innerWidth*dpr), H=Math.round(innerHeight*dpr);
  if(cv.width!==W||cv.height!==H){cv.width=W;cv.height=H;}
  const f=latest||{};
  const b=(f.bg&&okHex(f.bg.base)&&okHex(f.bg.from)&&okHex(f.bg.to))?f.bg:TOK;
  paintBg(now-t0,b);
  cx.imageSmoothingEnabled=true; cx.imageSmoothingQuality="high"; cx.drawImage(bg,0,0,W,H);
  const k=clamp(bP,0,1);
  const rad=Math.max(1, clamp(rP,0,0.5)*(0.97+0.03*k)*Math.min(W,H));
  const presence=shown==="offline"?0.5:1;
  cx.save(); cx.translate(W/2,H/2); cx.globalAlpha=presence;
  if(shown!=="offline"&&k>0.02){
    const reach=rad*(1.10+0.05*k);
    const halo=cx.createRadialGradient(0,0,rad*0.94,0,0,reach);
    halo.addColorStop(0,"rgba(245,245,247,"+(0.04+0.08*k).toFixed(3)+")");
    halo.addColorStop(1,"rgba(245,245,247,0)");
    cx.fillStyle=halo; cx.beginPath(); cx.arc(0,0,reach,0,2*Math.PI); cx.fill();
  }
  const drift=(0.05+0.04*liveLp+0.02*emLean)*(0.65+0.35*emA);
  const ox=-rad*drift*(0.75+0.25*Math.sin((now-t0)/3200));
  const oy=-rad*drift*(0.85+0.15*Math.cos((now-t0)/4100));
  const [ir,ig,ib]=markInner(emV);
  const fall=clamp(0.46+0.05*Math.sin((now-t0)/2400)*(0.4+liveLp)+0.04*emA,0.36,0.58);
  const g=cx.createRadialGradient(ox,oy,Math.max(1,rad*0.04),0,0,rad);
  g.addColorStop(0,"rgb("+ir+","+ig+","+ib+")");
  g.addColorStop(fall,MARK.core);
  g.addColorStop(0.90,MARK.core);
  g.addColorStop(1,MARK.edge);
  cx.fillStyle=g; cx.beginPath(); cx.arc(0,0,rad,0,2*Math.PI); cx.fill();
  cx.strokeStyle=MARK.stroke; cx.lineWidth=MARK.strokePx; cx.stroke();
  cx.restore();
  requestAnimationFrame(draw);
}

// Pipelined polling: a new request every 80 ms, ≤3 in flight, each with a timeout;
// out-of-order replies are dropped (t_ms), a restarted server (t_ms jumps back) is accepted.
function pollOnce(){
  if(inflight>=MAX_INFLIGHT) return;
  inflight++;
  const ac=window.AbortController?new AbortController():null;
  const to=setTimeout(()=>{try{ac&&ac.abort();}catch(e){}},FETCH_TIMEOUT_MS);
  fetch("dot",{cache:"no-store",signal:ac?ac.signal:undefined,headers:{"ngrok-skip-browser-warning":"1"}})
    .then(r=>r.ok?r.json():null)
    .then(j=>{
      if(!j||typeof j.radius!=="number") return;
      const t=+j.t_ms||0;
      if(t<=lastT&&t>lastT-2000) return;   // stale/out-of-order
      lastT=t; latest=j; lastOk=performance.now();
      if(j.persona) cv.dataset.persona=j.persona;
      if(!everOk){everOk=true;}
      onReply(j.reply);
    })
    .catch(()=>{})
    .finally(()=>{clearTimeout(to);inflight--;});
}
setInterval(pollOnce,POLL_MS);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible") pollOnce();});

function showErr(msg){
  errEl.textContent=msg||"";
  errEl.classList.toggle("show", !!msg);
}
function hideHint(){ hint.classList.add("hide"); }

function tickMic(){
  if(micState!=="on"||!micAnalyser||!micData) return;
  micAnalyser.getByteTimeDomainData(micData);
  let sum=0;
  for(let i=0;i<micData.length;i++){const v=(micData[i]-128)/128; sum+=v*v;}
  micRms=Math.sqrt(sum/micData.length);
  micFloor=micRms<micFloor?0.7*micFloor+0.3*micRms:micFloor+0.002*(micRms-micFloor);
  // Level for the dot (audio itself goes to /turn). One POST at a time so a slow link never queues up.
  if(!micPosting){
    micPosting=true;
    const lv={rms:+micRms.toFixed(4),t:Date.now()}; if(playing) lv.playing=playId;
    if(sessionToken) lv.session=sessionToken;
    try{fetch("mic",{method:"POST",headers:sessionHeaders({"Content-Type":"application/json"}),
      body:JSON.stringify(lv)}).catch(()=>{}).finally(()=>{micPosting=false;});}
    catch(e){micPosting=false;}
  }
  setTimeout(tickMic,80);
}

async function enableMic(){
  if(micState==="on"||micState==="pending") return;
  discloseAi();
  await ensureSession();
  if(!window.isSecureContext && location.hostname!=="localhost" && location.hostname!=="127.0.0.1"){
    showErr("Microphone needs HTTPS. Open the https:// link."); return;
  }
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
    showErr("This browser cannot open the microphone."); return;
  }
  micState="pending"; showErr("");
  // Create + unlock the AudioContext synchronously inside the tap (before any await) so that
  // mobile Safari/Chrome let us play reply audio later. Reused for capture and playback.
  ensureAudio();
  try{
    micStream=await navigator.mediaDevices.getUserMedia({
      audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true,channelCount:1},
      video:false
    });
    if(micCtx.state==="suspended") await micCtx.resume();
    const src=micCtx.createMediaStreamSource(micStream);
    micAnalyser=micCtx.createAnalyser();
    micAnalyser.fftSize=1024;
    src.connect(micAnalyser);
    micData=new Uint8Array(micAnalyser.fftSize);
    micState="on";
    hideHint();
    showErr("");
    tickMic();
    startCapture(src).catch(()=>showErr("Speech capture unavailable — level only."));
  }catch(e){
    micState="denied";
    const name=e&&(e.name||"");
    if(name==="NotAllowedError"||name==="PermissionDeniedError")
      showErr("Microphone blocked — allow it in browser settings, then tap again.");
    else if(name==="NotFoundError")
      showErr("No microphone found on this device.");
    else
      showErr("Could not open the microphone.");
  }
}

function onActivate(e){
  // First intentional tap: mic. Avoid synthetic click-after-touch double fire.
  if(e.type==="touchend"){ e.preventDefault(); enableMic(); return; }
  if(e.type==="click"){ enableMic(); }
}
cv.addEventListener("touchend",onActivate,{passive:false});
cv.addEventListener("click",onActivate);
addEventListener("keydown",e=>{
  if(e.target&&e.target.id==="say-text") return;
  if(e.key==="Enter"||e.key===" "){e.preventDefault();enableMic();}
});
const sayForm=document.getElementById("say"), sayInput=document.getElementById("say-text");
if(sayForm&&sayInput){
  sayForm.addEventListener("submit",e=>{
    e.preventDefault();
    const t=sayInput.value;
    sayInput.value="";
    sendText(t);
  });
}
async function sendText(text){
  const t=(text||"").trim();
  if(!t) return;
  // Same gesture as Send: unlock playback before any await, mic or not.
  if(!ensureAudio()){ showErr("This browser cannot play audio."); return; }
  const barge=playing;
  if(playing) stopPlayback();
  discloseAi();
  await ensureSession();
  turnsInFlight++;
  const watch=turnsInFlight;
  try{
    const r=await fetch("v2/say",{method:"POST",cache:"no-store",headers:sessionHeaders({"Content-Type":"application/json"}),
      body:JSON.stringify({text:t,barge:!!barge,e:0,sense:false})});
    if(!r.ok){ turnsInFlight=Math.max(0,turnsInFlight-1); showErr("Message failed ("+r.status+")."); return; }
    const j=await r.json();
    showErr("");
    if(j&&j.persona) cv.dataset.persona=j.persona;
    if(j&&j.mood&&MOOD[j.mood]){
      if(!latest) latest={radius:R.idle,t_ms:0};
      latest.mood=j.mood;
      latest.emotion={sense:true,label:j.mood,valence:0,arousal:0.3,lean:(latest.emotion&&latest.emotion.lean)||0};
    }
    hideHint();
    if(j&&(j.silence||!j.reply)){ turnsInFlight=Math.max(0,turnsInFlight-1); return; }
  }catch(e){ turnsInFlight=Math.max(0,turnsInFlight-1); showErr("Could not send that."); }
  setTimeout(()=>{ if(!playing&&turnsInFlight>=watch) turnsInFlight=Math.max(0,turnsInFlight-1); }, 20000);
}

// ───────────────────────── Voice pipeline: capture → VAD → /turn, reply playback ─────────────────
// Silent one-sample buffer played inside the gesture: the classic iOS "unlock".
function ensureAudio(){
  try{
    const AC=window.AudioContext||window.webkitAudioContext;
    if(!AC) return false;
    if(!micCtx) micCtx=new AC({latencyHint:"interactive"});
    unlockAudio(micCtx);
    hearReplies=true;
    return true;
  }catch(e){ return false; }
}
function unlockAudio(ctx){
  try{ if(ctx.state==="suspended") ctx.resume().catch(()=>{}); }catch(e){}
  try{ const b=ctx.createBuffer(1,1,ctx.sampleRate), s=ctx.createBufferSource();
       s.buffer=b; s.connect(ctx.destination); s.start(0); }catch(e){}
}

// AudioWorklet (inline module via Blob URL; page is one include_str! file) batching 128-frame
// quanta into ~2048-sample chunks. Falls back to ScriptProcessor where worklets are missing.
const WORKLET_SRC=`class GvCap extends AudioWorkletProcessor{
  constructor(){super();this.b=new Float32Array(2048);this.n=0;}
  process(ins){const c=ins[0]&&ins[0][0];if(c){for(let i=0;i<c.length;i++){this.b[this.n++]=c[i];
    if(this.n===this.b.length){this.port.postMessage(this.b.slice(0));this.n=0;}}}return true;}}
registerProcessor("gv-cap",GvCap);`;

async function startCapture(src){
  const ctx=micCtx; capRatio=ctx.sampleRate/CAP_SR; capPos=0;
  capSink=ctx.createGain(); capSink.gain.value=0; capSink.connect(ctx.destination); // keeps graph pulled, silent
  if(ctx.audioWorklet&&window.AudioWorkletNode&&window.Blob&&window.URL){
    try{
      const url=URL.createObjectURL(new Blob([WORKLET_SRC],{type:"application/javascript"}));
      await ctx.audioWorklet.addModule(url); URL.revokeObjectURL(url);
      capNode=new AudioWorkletNode(ctx,"gv-cap",{numberOfInputs:1,numberOfOutputs:1,channelCount:1,channelCountMode:"explicit"});
      capNode.port.onmessage=e=>onCapChunk(e.data);
      src.connect(capNode); capNode.connect(capSink); return;
    }catch(e){ capNode=null; }
  }
  const sp=(ctx.createScriptProcessor||ctx.createJavaScriptNode).call(ctx,2048,1,1);
  sp.onaudioprocess=e=>onCapChunk(new Float32Array(e.inputBuffer.getChannelData(0)));
  src.connect(sp); sp.connect(capSink); capNode=sp;
}

// Device rate → 16 kHz by box-averaging over each output sample's span (cheap anti-alias).
function onCapChunk(x){
  if(micState!=="on") return;
  const r=capRatio; let p=capPos;
  while(p+r<=x.length){
    const a=Math.floor(p), b=Math.min(x.length,Math.floor(p+r)); let s=0;
    for(let i=a;i<b;i++) s+=x[i];
    capFrame[capFill++]=b>a?s/(b-a):x[a];
    if(capFill===VAD_FRAME){ vadFrame(capFrame); capFrame=new Float32Array(VAD_FRAME); capFill=0; }
    p+=r;
  }
  capPos=p-x.length; if(capPos<0) capPos=0;
}

// Energy VAD with adaptive floor. Start after 80 ms of speech (200 ms + higher bar while our reply
// plays, so echo leaking past AEC does not self-barge). End of turn = 640 ms quiet after speech.
function vadFrame(f){
  let s=0; for(let i=0;i<f.length;i++) s+=f[i]*f[i];
  const rms=Math.sqrt(s/f.length), ms=1000*VAD_FRAME/CAP_SR;
  const thr=Math.max(VAD_ABS, vadFloor*VAD_FLOOR_X)*(playing?VAD_PLAY_X:1);
  const speech=rms>thr;
  if(!vadOn&&!speech) vadFloor=rms<vadFloor?0.8*vadFloor+0.2*rms:vadFloor+0.01*(rms-vadFloor);
  vadFloor=clamp(vadFloor,0.0005,0.05);
  if(!vadOn){
    preroll.push(f); while(preroll.length*ms>PREROLL_MS) preroll.shift();
    vadRun=speech?vadRun+ms:0;
    if(vadRun>=(playing?VAD_BARGE_MS:VAD_START_MS)){
      vadOn=true; uttBarge=playing; if(playing) stopPlayback();
      utt=preroll; preroll=[]; uttMs=utt.length*ms; vadSpeechMs=vadRun; vadQuiet=0;
    }
    return;
  }
  utt.push(f); uttMs+=ms;
  if(speech){ vadSpeechMs+=ms; vadQuiet=0; } else vadQuiet+=ms;
  if(vadQuiet>=VAD_END_MS||uttMs>=MAX_UTT_MS) endUtterance();
}

function endUtterance(){
  const frames=utt, ok=vadSpeechMs>=MIN_SPEECH_MS, barge=uttBarge;
  vadOn=false; vadRun=0; vadQuiet=0; vadSpeechMs=0; uttMs=0; utt=[]; uttBarge=false;
  if(ok) proceedTurn(frames,barge);
}

// The take is already cut. Proceed on the same POST /turn. Nothing new is drawn.
function proceedTurn(frames,barge){
  cv.dataset.proceed="auto";
  postTurn(frames,barge);
}

function encodeWav(frames,sr){
  const n=frames.reduce((a,f)=>a+f.length,0), buf=new ArrayBuffer(44+n*2), v=new DataView(buf);
  const str=(o,t)=>{for(let i=0;i<t.length;i++) v.setUint8(o+i,t.charCodeAt(i));};
  str(0,"RIFF"); v.setUint32(4,36+n*2,true); str(8,"WAVE"); str(12,"fmt ");
  v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true);
  v.setUint32(24,sr,true); v.setUint32(28,sr*2,true); v.setUint16(32,2,true); v.setUint16(34,16,true);
  str(36,"data"); v.setUint32(40,n*2,true);
  let o=44; for(const f of frames) for(let i=0;i<f.length;i++,o+=2){
    const x=clamp(f[i],-1,1); v.setInt16(o,x<0?x*0x8000:x*0x7FFF,true); }
  return buf;
}

// Body is an ArrayBuffer → the browser sets Content-Length itself (it is a forbidden header for JS).
function postTurn(frames,barge){
  const wav=encodeWav(frames,CAP_SR), id=Date.now().toString(36)+"-"+(++turnSeq);
  turnsInFlight++;
  const watch=turnsInFlight;
  fetch("turn",{method:"POST",cache:"no-store",body:wav,headers:sessionHeaders({
      "Content-Type":"audio/wav","X-Turn-Id":id,"X-Sample-Rate":String(CAP_SR),
      "X-Barge-In":barge?"1":"0","X-Galion-Proceed":"auto"})})
    .then(r=>{ if(!r.ok&&r.status!==404){ turnsInFlight=Math.max(0,turnsInFlight-1); showErr("Voice turn failed ("+r.status+")."); } else showErr(""); })
    .catch(()=>{ turnsInFlight=Math.max(0,turnsInFlight-1); });
  setTimeout(()=>{ if(!playing&&turnsInFlight>=watch) turnsInFlight=Math.max(0,turnsInFlight-1); }, 20000);
}

// /dot reply:{id,url,ms}. Replies already present before the tap are marked seen, never played.
function onReply(rp){
  if(!rp||rp.id==null||!rp.url) return;
  const id=String(rp.id);
  if(!hearReplies||!micCtx){ seenReplies.add(id); return; }
  if(seenReplies.has(id)) return;
  seenReplies.add(id); if(seenReplies.size>64) seenReplies=new Set([...seenReplies].slice(-32));
  if(vadOn) return;                                  // user is mid-utterance: this reply is stale
  playReply(id,String(rp.url));
}

function decode(ab){
  return new Promise((res,rej)=>{ const p=micCtx.decodeAudioData(ab,res,rej); if(p&&p.then) p.then(res,rej); });
}

async function playReply(id,url){
  try{
    const r=await fetch(url,{cache:"no-store",headers:sessionHeaders()});
    if(!r.ok) return;
    const buf=await decode(await r.arrayBuffer());
    if(vadOn) return;                                // user is mid-utterance: this reply is stale
    if(!hearReplies) return;
    if(micCtx.state==="suspended") await micCtx.resume().catch(()=>{});
    stopPlayback();
    if(!playAn){
      playAn=micCtx.createAnalyser(); playAn.fftSize=1024; playAn.smoothingTimeConstant=0.35;
      playData=new Uint8Array(playAn.fftSize);
    }
    const s=micCtx.createBufferSource(); s.buffer=buf; s.connect(playAn); playAn.connect(micCtx.destination);
    s.onended=()=>{ if(playSrc===s){ playSrc=null; playing=false; playId=null; turnsInFlight=0; } };
    playSrc=s; playId=id; playing=true; turnsInFlight=0; s.start(0);
  }catch(e){}
}

function stopPlayback(){
  const s=playSrc; playSrc=null; playing=false; playId=null;
  if(s){ try{s.onended=null; s.stop(0);}catch(e){} try{s.disconnect();}catch(e){} }
}

// iOS: resume audio after lock-screen return
document.addEventListener("visibilitychange",()=>{
  if(document.visibilityState==="visible"&&micCtx&&micCtx.state==="suspended") micCtx.resume().catch(()=>{});
});

pollOnce(); requestAnimationFrame(draw);
</script></body></html>
