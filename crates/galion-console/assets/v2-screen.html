<!doctype html>
<!-- Galion Voice — Perpetual Open MIT License. (c) 2026 Maciej Grajczyk.
     V2 one-dot. Samantha and Jarvis are internal test registers.
     The circle stays one mark: near-white body, thin stroke, soft spring,
     a quiet interior that follows the voice-config wash. No nameplate.
     The mouth on this page is the browser. It is not Piper and not a film voice.
     Rights hold stays closed. No clip. -->
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0A0A0C">
<title>Galion Voice</title>
<style>
html,body{margin:0;height:100%;background:#0A0A0C;overflow:hidden;touch-action:manipulation}
canvas{position:fixed;inset:0;width:100%;height:100%}
#hint{position:fixed;left:24px;right:24px;bottom:max(28px,env(safe-area-inset-bottom));
  text-align:center;font:500 15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  color:rgba(245,245,247,.62);pointer-events:none}
#ai{position:fixed;left:16px;right:16px;top:max(14px,env(safe-area-inset-top));
  text-align:center;font:500 11px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  color:rgba(245,245,247,.42);pointer-events:none}
</style></head>
<body>
<canvas id="s" data-mark="orb" data-profile="luti" data-persona="samantha" data-mouth="browser" data-film-voice="false" data-rights="hold"></canvas>
<div id="ai">You are talking to an AI. Galion is an AI assistant, not a person. This test voice is not a film clone.</div>
<div id="hint">Tap the dot. Type, then enter.</div>
<script>
"use strict";
const TOK={dot:"#F5F5F7",base:"#0A0A0C",from:"#F5A524",to:"#7C3AED"};
const LUTI={idle:{w:1.8,z:0.92},listening:{w:3.4,z:0.88},thinking:{w:2.4,z:0.90},speaking:{w:3.0,z:0.92},offline:{w:2.0,z:1.02}};
const R={idle:0.100,listen:0.128,speak:0.108,off:0.062};
const cv=document.getElementById("s"), cx=cv.getContext("2d",{alpha:false});
const hint=document.getElementById("hint");
const hex=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const lerp=(a,b,t)=>a+(b-a)*t;
const mix=(a,b,t)=>a.map((x,i)=>Math.round(x+(b[i]-x)*t));
const MOOD={
  calm:{wash:0.38,amber:0.46,warm:0.30},
  grief:{wash:0.58,amber:0.08,warm:0.14},
  joy:{wash:0.66,amber:0.84,warm:0.62},
  vulnerability:{wash:0.44,amber:0.22,warm:0.20},
  quiet:{wash:0.20,amber:0.28,warm:0.24}
};
let W=0,H=0,mode="idle",wash=0.38,amber=0.46,warm=0.30,wScale=1,zMix=0,eShow=0,mood="calm";
let rP=R.idle,rV=0,bP=0.84,bV=0,buf="",reply="",speaking=false,waitTimer=0,lastFrame=performance.now();
let sessionToken="";
function fit(){W=cv.width=innerWidth*devicePixelRatio;H=cv.height=innerHeight*devicePixelRatio;cv.style.width=innerWidth+"px";cv.style.height=innerHeight+"px"}
addEventListener("resize",fit);fit();
async function ensureSession(){
  if(sessionToken)return;
  try{
    const r=await fetch("session",{method:"POST",headers:{"Content-Type":"application/json"},body:"{\"op\":\"open\"}"});
    if(!r.ok)return;
    const j=await r.json();
    if(j&&typeof j.token==="string")sessionToken=j.token;
  }catch(e){}
}
function headers(){
  const h={"Content-Type":"application/json"};
  if(sessionToken)h["X-Galion-Session"]=sessionToken;
  return h;
}
function spring(p,v,target,w,z,dt){
  const a=-w*w*(p-target)-2*z*w*v;
  v+=a*dt; p+=v*dt;
  return [p,v];
}
function paint(dt){
  const motion=mode==="listening"?LUTI.listening:mode==="speaking"?LUTI.speaking:mode==="offline"?LUTI.offline:LUTI.idle;
  const target=mode==="listening"?R.listen:mode==="speaking"?R.speak:mode==="offline"?R.off:R.idle;
  const bright=mode==="offline"?0.34:mode==="listening"?1:mode==="speaking"?0.92:0.84;
  const w=motion.w*wScale, z=lerp(motion.z,0.92,zMix);
  [rP,rV]=spring(rP,rV,target,w,z,dt);
  [bP,bV]=spring(bP,bV,bright,w*0.85,Math.min(1.2,z+0.08),dt);
  const bg=cx.createLinearGradient(0,0,W,H);
  const amberC=mix(hex(TOK.base),hex(TOK.from),0.16+0.42*amber);
  const violet=mix(hex(TOK.base),hex(TOK.to),0.28*(1-amber*0.55));
  bg.addColorStop(0,"rgb("+amberC+")");
  bg.addColorStop(1,"rgb("+violet+")");
  cx.fillStyle=bg; cx.fillRect(0,0,W,H);
  const rad=Math.min(W,H)*rP;
  const x=W/2,y=H/2;
  cx.save();
  cx.beginPath(); cx.arc(x,y,rad,0,Math.PI*2); cx.clip();
  const body=cx.createRadialGradient(x-rad*0.2,y-rad*0.25,rad*0.1,x,y,rad);
  body.addColorStop(0,"#FFFFFF");
  body.addColorStop(0.55,TOK.dot);
  body.addColorStop(1,"#E4E4E8");
  cx.fillStyle=body; cx.fillRect(x-rad,y-rad,rad*2,rad*2);
  const inner=cx.createRadialGradient(x,y,rad*0.05,x,y,rad*0.92);
  const glow=mix(hex(TOK.to),hex(TOK.from),wash);
  inner.addColorStop(0,"rgba("+glow+","+(0.08+0.22*warm)+")");
  inner.addColorStop(1,"rgba("+glow+",0)");
  cx.fillStyle=inner; cx.fillRect(x-rad,y-rad,rad*2,rad*2);
  cx.restore();
  cx.beginPath(); cx.arc(x,y,rad,0,Math.PI*2);
  cx.strokeStyle="rgba(245,245,247,0.55)";
  cx.lineWidth=Math.max(1,1.25*devicePixelRatio);
  cx.stroke();
  cv.dataset.persona=cv.dataset.persona||"samantha";
  cv.dataset.luti=w.toFixed(2)+","+z.toFixed(2);
}
function frame(t){
  const dt=Math.min(0.05,Math.max(0.001,(t-lastFrame)/1000));
  lastFrame=t;
  if(!ever)mode="offline";
  paint(dt);
  requestAnimationFrame(frame);
}
let ever=false;
async function pull(){
  try{
    const r=await fetch("v2/state",{cache:"no-store"});
    if(!r.ok){mode="offline";return}
    const j=await r.json();
    ever=true;
    if(mode==="offline")mode="idle";
    if(j&&j.mood&&MOOD[j.mood]){
      const t=MOOD[j.mood];
      wash+=(t.wash-wash)*0.35; amber+=(t.amber-amber)*0.35; warm+=(t.warm-warm)*0.35;
      mood=j.mood; cv.dataset.mood=mood;
    }
    if(j&&j.prosody){
      if(typeof j.luti_w==="number")wScale=j.luti_w;
      zMix=0;
      cv.dataset.persona=j.persona||"samantha";
      cv.dataset.mouth=j.mouth||"browser";
      cv.dataset.filmVoice=j.film_voice?"true":"false";
      cv.dataset.rights=j.rights||"hold";
    }
  }catch(e){mode="offline"}
}
setInterval(pull,80); pull();
function stopMouth(){
  speaking=false;
  if(waitTimer){clearTimeout(waitTimer);waitTimer=0}
  if(window.speechSynthesis)speechSynthesis.cancel();
}
function speak(text,pause,rate,pitch){
  stopMouth();
  if(!text){mode="idle";hint.textContent="Tap the dot. Type, then enter.";return}
  mode="speaking"; speaking=true;
  hint.textContent=text;
  waitTimer=setTimeout(()=>{
    waitTimer=0;
    if(!window.speechSynthesis){setTimeout(()=>{speaking=false;mode="idle"},Math.min(4000,text.length*62));return}
    const u=new SpeechSynthesisUtterance(text);
    u.rate=rate||1; u.pitch=pitch||1; u.volume=1;
    u.onend=()=>{speaking=false;mode="idle"};
    u.onerror=()=>{speaking=false;mode="idle"};
    speechSynthesis.speak(u);
  },pause||0);
}
async function send(text,barge){
  await ensureSession();
  if(barge)stopMouth();
  mode="thinking";
  const r=await fetch("v2/say",{method:"POST",headers:headers(),body:JSON.stringify({text,barge:!!barge,e:0,sense:false})});
  const j=await r.json();
  if(j.mood&&MOOD[j.mood]){
    const t=MOOD[j.mood]; wash=t.wash; amber=t.amber; warm=t.warm; mood=j.mood; cv.dataset.mood=mood;
  }
  if(j.luti_w!=null)wScale=j.luti_w;
  zMix=j.prosody&&j.prosody.pre_pause_ms>80?Math.min(1,j.prosody.pre_pause_ms/250):0;
  eShow=j.prosody?Math.max(0,Math.min(1,(j.prosody.warmth-0.4)/0.4)):0;
  cv.dataset.persona=j.persona||cv.dataset.persona;
  if(j.silence||!j.reply){stopMouth();mode="idle";hint.textContent="";return}
  const pitch=1+(j.prosody?j.prosody.pitch_st:0)/12;
  speak(j.reply,j.pre_pause_ms||0,j.prosody?j.prosody.rate:1,pitch);
}
addEventListener("keydown",e=>{
  if(e.key==="Enter"){
    const t=buf.trim(); buf="";
    if(!t)return;
    send(t,speaking);
    return;
  }
  if(e.key==="Backspace"){buf=buf.slice(0,-1);hint.textContent=buf||"Tap the dot. Type, then enter.";return}
  if(e.key==="Escape"){buf="";stopMouth();mode="idle";hint.textContent="Tap the dot. Type, then enter.";return}
  if(e.key.length===1&&!e.metaKey&&!e.ctrlKey){
    if(speaking)stopMouth();
    mode="listening";
    buf+=e.key;
    hint.textContent=buf;
  }
});
cv.addEventListener("pointerdown",()=>{if(speaking){stopMouth();mode="listening"}});
requestAnimationFrame(frame);
</script>
</body></html>
