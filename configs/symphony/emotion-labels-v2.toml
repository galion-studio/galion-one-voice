# Acoustic-label stub. The name inventory is configs/emotions-v2.toml (24).
# Prosody and burst use that same set. Neutral is the baseline, not a row.
# Breath is physiology, not a row. seductive renders as desire.
# Feature ids are openSMILE eGeMAPSv02 names.
# z against the speaker's own neutral is unknown until measured.

schema = 2
relative_to = "speaker_neutral"
inventory = "configs/emotions-v2.toml"

set = [
  "adoration",
  "amusement",
  "anger",
  "awe",
  "confusion",
  "contempt",
  "contentment",
  "desire",
  "disappointment",
  "disgust",
  "distress",
  "ecstasy",
  "elation",
  "embarrassment",
  "fear",
  "interest",
  "pain",
  "realization",
  "relief",
  "sadness",
  "surprise_negative",
  "surprise_positive",
  "sympathy",
  "triumph",
]

[alias]
seductive = "desire"
laughter = "amusement"

[features.f0_mean]
unit = "z"
neutral_std = 0.0
egemaps = "F0semitoneFrom27.5Hz_sma3nz_amean"

[features.loudness]
unit = "z"
neutral_std = 0.0
egemaps = "loudness_sma3_amean"

[features.hnr]
unit = "z"
neutral_std = 0.0
egemaps = "HNRdBACF_sma3nz_amean"

[features.rate]
unit = "z"
neutral_std = 0.0
egemaps = "VoicedSegmentsPerSec"

[features.pause]
unit = "z"
neutral_std = 0.0
egemaps = "MeanUnvoicedSegmentLength"
