# Step sizes for the mouth layer. A published sign is not a size.
# "unknown" stays null in the control packet. Do not fill these from a
# neighbour, from Banse z, or from Tartter's per-speaker hertz.
# phone_ms is the Symphony clock used when a phone has no duration.
# It is not a measured phone length.

[timing]
phone_ms = 80

[scales]
