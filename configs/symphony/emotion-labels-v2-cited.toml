# Integrator note: PR #191's decoder reads emotion-labels-v2.toml (schema 2).
# This file is PR #189's cited direction tables, unchanged, kept beside it.
# Galion Voice — Perpetual Open MIT License
# Copyright (c) 2026 Galion Labs.
#
# Acoustic directions for the Cowen 2019 names.
# The inventory is configs/emotions-v2.toml. This file does not define it.
# Prose and citations: docs/galion-voice-v2/symphony/ARTICULATION-V2-SPEC.md
#
# z_vs_own_neutral = (x - this_speaker_neutral_mean) / this_speaker_neutral_sd
# That z is unknown for every region below. Directions are not that z.
# A feature absent from a region is unknown, to be learned from data.
# "pooled" was not measured separately on men and women.

schema = "galion-articulation-emotion-labels-v2"
tick_ms = 80
tick_note = "Symphony clock. Not a published emotion time constant."
state = ["arousal", "valence", "dominance"]
z_vs_own_neutral = "unknown, to be learned from data"
reference = "speaker_own_neutral"

[features.f0_mean]
egemaps = "F0semitoneFrom27.5Hz_sma3nz_amean"
stage = "glottis"
unit = "semitone_from_27.5Hz"

[features.f0_range]
egemaps = "F0semitoneFrom27.5Hz_sma3nz_pctlrange0-2"
stage = "glottis"
unit = "semitone"

[features.loudness]
egemaps = "loudness_sma3_amean"
stage = "lungs"
unit = "loudness"
note = "Proxy of expiratory drive. Not subglottal pressure."

[features.rate]
egemaps = "VoicedSegmentsPerSec"
stage = "lungs"
unit = "1/s"
note = "Pseudo syllable rate. Not words per minute."

[features.pause]
egemaps = "MeanUnvoicedSegmentLength"
stage = "lungs"
unit = "s"
note = "Mean F0=0 length. Approximates pauses and includes closures."

[features.alpha_ratio]
egemaps = "alphaRatioV_sma3nz_amean"
stage = "glottis_tract"
unit = "dB"
sign = "10*log10(energy_1kHz_to_5kHz / energy_below_1kHz)"
sign_source = "opensmile300"

[features.hnr]
egemaps = "HNRdBACF_sma3nz_amean"
stage = "glottis"
unit = "dB"
note = "Air leak. No per-region direction in the sources read."

[features.f1]
egemaps = "F1frequency_sma3nz_amean"
stage = "jaw"
unit = "Hz"

[features.f2]
egemaps = "F2frequency_sma3nz_amean"
stage = "lips"
unit = "Hz"

[features.f3]
egemaps = "F3frequency_sma3nz_amean"
stage = "tract"
unit = "Hz"
note = "Baseline and laughter. Emotion direction unknown."

[features.breath_rate]
egemaps = ""
stage = "lungs"
unit = "breaths/min"
note = "Not an eGeMAPS feature."

[features.inspiratory_time]
egemaps = ""
stage = "lungs"
unit = "s"

[features.tidal_volume]
egemaps = ""
stage = "lungs"
unit = "volume"

[features.inspiratory_pause]
egemaps = ""
stage = "lungs"
unit = "s"

[baseline.rule]
z = "(x - speaker_neutral_mean) / speaker_neutral_sd"
match = "same noise, room and distance as the neutral, or the tick is confounded"
personality = "unknown, to be learned from data"
fatigue = "unknown, to be learned from data"
health_hydration = "unknown, to be learned from data"
adult_age_f0 = "unknown, to be learned from data"
speech_f0_population = "unknown, to be learned from data"

[baseline.vtl_mm.female]
ages = "19-25"
n = 3
mean = 138.8
sd = 3.4
min = 135.2
max = 141.9
posture = "quiet respiration, curved-line MRI, not speech"
source = "fitch1999"
locus = "Table I, p. 1514"

[baseline.vtl_mm.male]
ages = "19-25"
n = 7
mean = 155.4
sd = 4.4
min = 146.9
max = 160.0
posture = "quiet respiration, curved-line MRI, not speech"
source = "fitch1999"
locus = "Table I, p. 1514"

# --- factors: published moves only ---

