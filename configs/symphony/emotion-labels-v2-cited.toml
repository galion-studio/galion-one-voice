# --- cited acoustic rows ---
# The 24 names, both tracks, and the prosody tiers live in configs/emotions-v2.toml.
# A row here is a cited direction, not a second inventory. Do not add a retired name.
# juslin_modal: high / low / fast / slow / bimodal / inconsistent
# banse_z_*: Table 6, sex and actor partialed out, vs the cross-emotion mean.
# articulation_duration_z is Banse DurArt. Higher means slower, not faster.
# A missing feature is unknown, to be learned from data.

[regions.adoration]
from_old = "tender"
z_vs_own_neutral = "unknown, to be learned from data"
scope_note = "Juslin called this love-tenderness, not adoration."

[regions.adoration.juslin_modal]
scope = "pooled"
f0_mean = "lower"
f0_range = "lower"
loudness = "lower"
rate = "slower"
alpha_ratio = "lower"
pause = "unknown, to be learned from data"
source = "juslin2003"
locus = "Table 7, pp. 792-795; pauses p. 796"

[regions.adoration.male]
same_as = "juslin_modal"
sex_specific_z = "unknown, to be learned from data"

[regions.adoration.female]
same_as = "juslin_modal"
sex_specific_z = "unknown, to be learned from data"

[regions.amusement]
from_old = ["amused", "happy", "excited"]
