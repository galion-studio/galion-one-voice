[factors.lombard_loudspeaker]
kind = "external"
loudness = "higher"
amount_db_spl = 17.2
from_db_spl = 40
to_db_spl = 86
noise = "cocktail party"
n = 10
partner_m = 2
source = "garnier2010"
locus = "Experiment 1, JSLHR 53, 588-608"

[factors.lombard_headphone_offset]
