f0_offset_tones_cktl = 1.2
note = "Headphones minus loudspeakers. Not the quiet-to-noise slope."
source = "garnier2010"
locus = "Experiment 1"

[factors.lombard_interactive]
kind = "external"
loudness = "higher"
f0_mean = "higher"
alpha_ratio = "unknown, to be learned from data"
f1 = "higher"
lip_opening = "larger"
amount = "unknown, to be learned from data"
n_female = 3
noise_db_spl = 85
partner_m = 2.5
source = "garnier2010"
locus = "Experiment 2"

[factors.distance]
kind = "external"
amount = "unknown, to be learned from data"

[factors.room]
kind = "external"
amount = "unknown, to be learned from data"
note = "Voice-quality features lose accuracy in noise and reverberation. Size unknown."
source = "eyben2016"
locus = "section 2"

[factors.turn_taking]
kind = "external"
