pooled_attractive_sd = 69.58
pooled_unattractive_hz = 215.44
pooled_unattractive_sd = 72.38
t = -2.98
df = 44
male_attractive_hz = 142.95
male_unattractive_hz = 145.25
female_attractive_hz = 261.55
female_unattractive_hz = 271.59
source = "hughes2010"
locus = "p. 160"
