# Galion Voice — Perpetual Open MIT License
[package]
name = "galion-piper-rt"
description = "Piper runtime on onnxruntime 1.31 (Rust, out of process): same models, phonemizer and stdin/stdout protocol as piper 2023.11.14-2, with intra-op thread, spinning and core-pinning control. Owner approval t613s2992 (2026-11-04)."
version = "0.0.1"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["load-dynamic", "std"] }
serde_json = "1"
libc = "0.2"

[[bin]]
name = "galion-piper-rt"
path = "src/main.rs"

[workspace]

[profile.release]
opt-level = 3
