[package]
name = "nebula-voice-v2"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "Nebula Galion Voice V2, a living nebula driven by Emotion V2."

[workspace]

[lib]
name = "nebula_voice_v2"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "nebula-voice-v2"
path = "src/main.rs"

[features]
default = []
window = ["dep:winit", "dep:softbuffer", "dep:wgpu", "dep:pollster"]
# Alias of `window`. wgpu 23 compiles its GL/GLES backend by default; the Pi
# build requests the low-power Vulkan adapter and then GL.
gles = ["window"]

[dependencies]
nebula-elements = { path = "../../crates/nebula-elements" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
winit = { version = "0.30", optional = true }
softbuffer = { version = "0.4", optional = true }
wgpu = { version = "23", optional = true }
pollster = { version = "0.4", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { version = "23", features = ["webgl"] }
wasm-bindgen = "=0.2.100"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = ["Window", "Document", "HtmlCanvasElement", "Element", "Performance", "Navigator", "CanvasRenderingContext2d", "ImageData", "console"] }
