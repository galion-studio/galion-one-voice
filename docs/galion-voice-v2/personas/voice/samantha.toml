# Galion Voice V2 — Samantha voice config (draft)
# Perpetual Open MIT License. (c) 2026 Maciej Grajczyk.
#
# The /v2 demo route reads this file for prosody, wash, tags, and the
# reference gate. clone_live is not a key in this file. It is true on
# /v2/state only when the worker, the pinned weights, and a consented
# reference are all present. This file does not name a wav.

schema = 1
status = "draft"
program = "Galion Voice V2"
id = "samantha"
wired = true
session_default = true

[register]
label = "conversational"
summary = "Warm, curious, Her-inspired conversational layer. Test register. Not a shipped film voice and not a claim about the Piper checkpoint."
lines = "often two sentences; one when one is the whole truth"
accent_claim = "none"
prosody_source = "docs/galion-voice-v2/SAMANTHA-V2.md#4-mid-session-personality-switching"

[register.prosody.e0]
pitch_st = 0.0
pitch_range = 1.00
rate = 1.00
loudness = 1.00
warmth = 0.62
pre_pause_ms = 0

[register.prosody.e1]
pitch_st = -0.5
pitch_range = 0.88
rate = 0.92
loudness = 0.80
warmth = 0.75
pre_pause_ms = 250

[register.wash]
amber_e0 = 0.62
amber_e1 = 0.50

# Proposal in SAMANTHA-V2.md §4. The named Luti table stays the source.
[register.luti]
status = "proposal"
w_e0 = 1.00
w_e1 = 0.85
z_e1 = 0.92

[tags]
enabled = true
# Control tokens for a future clone model. Not words the caller should hear.
# Piper and flite must not be given these tokens (spoken rubbish or a drop).
on_clone = true
on_piper = false
on_flite = false
allowed = ["[laugh]", "[chuckle]"]
unknown_tags = "off"
note = "GALION-VOICE-V2.md names these two. The rest of any Turbo/Nano tag set is not copied here."

[reference]
rights = "hold"
ingest = false
present = false
duration_target_s = 10
min_duration_s = 8
max_duration_s = 12
upstream_assert_s = 5
clip_path = ""
store_env = "GALION_CLIP_STORE"
wav_name = "reference.wav"
consent_name = "consent.txt"
placeholder = "docs/galion-voice-v2/personas/refs/samantha.placeholder"
note = "placeholder is a text marker. It is not audio. Do not commit a wav. The speak line has no path. Conditioning is a separate op, and only after consent.py accepts this persona."

[reference.consent]
scope = "local-zero-shot-conditioning"
public_demo_default = "no"
required = ["date", "persona", "work", "performer", "grantor", "instrument", "grantee", "scope", "public_demo", "expiry", "operator", "withdrawal", "counsel", "sha256", "duration_s"]

[worker]
binding = "galion.clone.worker"
kind = "clone"
bound = true
process = "out-of-process"
script = "scripts/clone/chatterbox_worker.py"
env_persona = "GALION_CLONE_PERSONA"
env_model = "GALION_CLONE_MODEL"
env_worker = "GALION_CLONE_WORKER"
model = "nano"
quality_option = "turbo"
request_persona = "samantha"
request_tags = true
send_reference = false
condition_op = true
generate_env = "GALION_CLONE_GENERATE"
device = "cpu"
thread_cap = false
rate_hz = 24000
pcm = "s16le"
weights_vendored = false
weights_dir = "weights/clone"

[fallback]
order = ["piper", "flite"]

[fallback.piper]
engine = "piper"
voice = "en_US-ljspeech-medium"
artifact = "weights/tts/en_US-ljspeech-medium.onnx"
when = "clone worker absent, unwired, or dead; or the reference gate is closed"
tags = false
is_film_voice = false

[fallback.flite]
engine = "flite"
when = "A21 Piper pack missing"
tags = false
