# Galion Voice V2 — Jarvis voice config (draft)
# Perpetual Open MIT License. (c) 2026 Maciej Grajczyk.
#
# The /v2 demo route reads this file for prosody, wash, and tags.
# The clone worker reads the reference table and the worker table when
# it builds a request. The public page is still not a film voice. Weights are not
# vendored. Register numbers are the design table in SAMANTHA-V2.md §4.
# A British accent is the intended register, not a fact about
# en_US-ljspeech-medium. Local reference send is owner t273.
# The wav is the Tony Stark hub texture. Do not clean it.

schema = 1
status = "draft"
program = "Galion Voice V2"
id = "jarvis"
wired = true
session_default = false

[register]
label = "command"
summary = "Calm, precise, command and interface. Short lines. Test register. Not a shipped film voice."
lines = "one sentence; a second only for a number, a limit, or a refusal"
accent_claim = "intended-not-checkpoint"
prosody_source = "docs/galion-voice-v2/SAMANTHA-V2.md#4-mid-session-personality-switching"

[register.prosody.e0]
pitch_st = -0.3
pitch_range = 0.92
rate = 0.96
loudness = 0.92
warmth = 0.42
pre_pause_ms = 80

[register.prosody.e1]
pitch_st = -0.4
pitch_range = 0.90
rate = 0.94
loudness = 0.88
warmth = 0.55
pre_pause_ms = 120

[register.wash]
amber_e0 = 0.28
amber_e1 = 0.50

# Proposal in SAMANTHA-V2.md §4. The named Luti table stays the source.
[register.luti]
status = "proposal"
w_e0 = 1.08
w_e1 = 0.90
z_e1 = 0.92

[tags]
enabled = false
on_clone = false
on_piper = false
on_flite = false
allowed = []
strip_brackets = true
unknown_tags = "off"
note = "Tags stay off on the Rust request line (tags=false), so the Nano path strips bracket tags. The protocol stub also strips them when persona is jarvis. A request that omits the flag keeps the text."

[reference]
rights = "owner-t273"
ingest = false
present = true
duration_target_s = 10
min_duration_s = 5
duration_s = 15.95
sample_rate_hz = 48000
channels = 2
bits = 16
sha256 = "c2200b59fa78b3c98d13ac5dc7db3a6c14e802310dca73033d7770bd4b532c60"
clip_path = "docs/galion-voice-v2/personas/refs/jarvis.wav"
store_rel = "jarvis/reference.wav"
texture = "preserve-hub"
texture_layer = "jarvis-hub"
texture_toggle = "GALION_JARVIS_TEXTURE"
texture_default = "on"
texture_stripped = false
denoise = false
placeholder = "docs/galion-voice-v2/personas/refs/jarvis.placeholder"
note = "Current model reference. Not clean speech: Tony Stark hub virtual texture (clicks, alarms, ambience) is character. Do not strip, denoise, or clean. WAV only, gitignored. Also $GALION_CLIP_STORE/jarvis/reference.wav. Never an MP3. Public demo stays closed. Hub clicks, alarms, and ambience are also a separate toggleable layer (GALION_JARVIS_TEXTURE, see symphony/JARVIS-TEXTURE.md); the toggle does not denoise the asset."

[worker]
binding = "galion.clone.worker"
kind = "clone"
bound = true
process = "out-of-process"
script = "scripts/clone/chatterbox_worker.py"
env_persona = "GALION_CLONE_PERSONA"
env_model = "GALION_CLONE_MODEL"
env_worker = "GALION_CLONE_WORKER"
env_refs = "GALION_CLONE_LOCAL_REFS"
env_store = "GALION_CLIP_STORE"
model = "nano"
quality_option = "turbo"
request_persona = "jarvis"
request_tags = false
send_reference = true
device = "cpu"
threads = 1
session_vcpu = 1
burst_vcpu_note = "cascade planning ceiling, not this child"
env_clip_store = "GALION_CLIP_STORE"
env_threads = "GALION_CLONE_THREADS"
denoise = false
rate_hz = 24000
pcm = "s16le"
weights_vendored = false
weights_dir = "weights/clone"

[fallback]
order = ["piper", "flite"]

[fallback.piper]
engine = "piper"
voice = "en_US-ljspeech-medium"
artifact = "weights/tts/en_US-ljspeech-medium.onnx"
when = "clone worker absent, unwired, ref not allowlisted, or dead"
tags = false
is_film_voice = false

[fallback.flite]
engine = "flite"
when = "A21 Piper pack missing"
tags = false
